<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Castle defense</title>
<style>
:root{--ink:#1d2a3a;--muted:#6b7480;--panel:#fffdf8;--line:#d9d6cc;--red:#c0392b;--gold:#d79a00;--ok:#2e7d32;--accent:#1f5fa8;--pc:#1f5fa8;
  --tfont:"Century Gothic","URW Gothic","URW Gothic L","Avant Garde",Futura,"Trebuchet MS",sans-serif;--font:Arial,"Liberation Sans",Helvetica,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#20262e;color:var(--ink);font-family:var(--font);user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
#app{position:fixed;inset:0;display:grid;grid-template-rows:auto minmax(0,1fr);grid-template-columns:minmax(0,27fr) minmax(0,51fr) minmax(0,22fr);font-size:var(--fs,15px)}
/* barre du haut */
#top{grid-column:1/4;display:flex;align-items:center;gap:1em;padding:.3em .7em;background:#2b3440;color:#f4efe4;min-height:2.4em}
#top .ttl{font-family:var(--tfont);font-weight:700;white-space:nowrap}
#top .ttl small{font-weight:400;opacity:.75;margin-left:.4em}
#top .mid{flex:1;display:flex;align-items:center;justify-content:center;gap:1.3em;white-space:nowrap;min-width:0}
#top .wv{font-weight:700;font-family:var(--tfont)}
#top .nx{opacity:.8;font-size:.85em}
#top .hp{display:flex;align-items:center;gap:.35em}
#top .hpb{width:8em;height:.7em;border-radius:.35em;background:#57606b;overflow:hidden}
#top .hpb i{display:block;height:100%;background:linear-gradient(#5fd17a,#2e9e4f);transition:width .25s}
#top .hpb.low i{background:linear-gradient(#ff8a7a,#d63a2a)}
.pill{display:inline-flex;align-items:center;gap:.3em;background:rgba(255,255,255,.12);padding:.1em .6em;border-radius:1em;font-weight:700;font-size:1.1em}
.pill.bump{animation:bump .5s}
@keyframes bump{30%{transform:scale(1.25);background:#f1c40f;color:#3b2f00}}
#stk{font-size:.85em;color:#ffd166}
.coin{width:1em;height:1em;flex:none;vertical-align:-.15em}
#top .btns{display:flex;gap:.3em}
.ib{display:inline-flex;align-items:center;justify-content:center;width:2em;height:2em;border-radius:.45em;border:0;background:#3b4654;color:#f4efe4;padding:0}
.ib svg{width:1.2em;height:1.2em}
.ib:hover{background:#4a5768}
.ib.on{background:#f4efe4;color:#2b3440}
/* trois colonnes */
#qpane{grid-row:2;grid-column:1;background:var(--panel);border-right:3px solid #2b3440;display:flex;flex-direction:column;justify-content:center;padding:.8em;gap:1em;min-height:0;overflow:hidden}
#stage{grid-row:2;grid-column:2;position:relative;overflow:hidden;background:#20262e}
#shop{grid-row:2;grid-column:3;background:#f4efe4;border-left:3px solid #2b3440;padding:.7em;overflow:auto;display:flex;flex-direction:column;gap:.45em}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#banner{position:absolute;left:50%;top:.6em;transform:translateX(-50%);font-family:var(--tfont);font-weight:700;font-size:1.6em;color:#fff;background:rgba(25,32,40,.75);padding:.15em .9em;border-radius:1em;pointer-events:none;opacity:0;transition:opacity .4s;white-space:nowrap;text-align:center}
#banner.show{opacity:1}
#banner small{display:block;font-size:.5em;font-weight:400}
/* questions */
.qtop{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden;flex:0 1 auto;min-height:0;padding:.5em 0}
.zp{color:var(--muted);line-height:1.2}
.zx{line-height:1.25;white-space:nowrap;display:flex;align-items:center;justify-content:center;max-width:100%;margin-top:.2em}
.zx .op{margin:0 .25em}
.zx.wrapok{white-space:normal}
.qans{display:flex;flex-direction:column;align-items:center;gap:.5em}
.hint{color:var(--muted);font-size:.85em;text-align:center}
.za{display:grid;grid-template-columns:1fr 1fr;gap:.5em;width:100%}
.ch{min-width:0;display:flex;align-items:center;justify-content:center;gap:.4em;padding:.3em;border-radius:.5em;border:2px solid var(--line);background:#fff;font-size:1.5em;min-height:2.6em;line-height:1.1}
.ch:hover{border-color:var(--pc);background:#eef4fb}
.again{font-size:.8em;color:#7a3b00;text-align:center}
.gq{align-self:center;display:inline-flex;align-items:center;gap:.35em;background:#fff2c2;border:2px solid #f1c40f;border-radius:1em;padding:.1em .8em;color:#5c4500;font-size:.95em}
.gq b{font-size:1.25em;color:#7a5c00}
.gq .coin{width:1.3em;height:1.3em}
.qtop.small{flex:0 0 auto;padding:.1em 0}
.qtop.small .zp{font-size:.85em}
s.mine{text-decoration-thickness:.08em;color:var(--red)}
.ms{color:#7a3b00}
/* droite graduée à cliquer (estimer) */
.nl{position:relative;width:100%;height:4.6em;margin:.3em 0}
.nl.det{height:3.6em;margin:.5em auto;max-width:26em}
.nlz{position:absolute;left:1.2em;right:1.6em;top:0;bottom:0}
.nzone{position:absolute;top:.2em;height:2.2em;margin-left:2px;border:2px solid #b9cbe0;border-radius:.4em;background:#eef4fb;padding:0}
.nzone:hover{background:#cfe0f5;border-color:var(--pc)}
.nl.det .nzone{pointer-events:none;background:#f4f2ec;border-color:#ddd8cc}
.nl.det .nzone.good{background:#dff0df;border-color:var(--ok)}
.nzone.open{border-right-style:dashed}
.nax{position:absolute;left:0;right:-1.2em;top:1.3em;height:.16em;background:var(--ink);pointer-events:none}
.nax::after{content:"";position:absolute;right:-.1em;top:-.32em;border-left:.7em solid var(--ink);border-top:.4em solid transparent;border-bottom:.4em solid transparent}
.ntk{position:absolute;top:.75em;width:.16em;height:1.25em;margin-left:-.08em;background:var(--ink);pointer-events:none}
.nlb{position:absolute;top:2.55em;transform:translateX(-50%);font-size:1.15em;pointer-events:none;line-height:1}
.nmk{position:absolute;top:.15em;width:.9em;height:.9em;margin-left:-.45em;border-radius:50%;background:var(--red);border:2px solid #fff;box-shadow:0 0 0 1px var(--red)}
.ch.tx{font-size:1em}
.ch .frac{font-size:.85em}
kbd{display:inline-flex;align-items:center;justify-content:center;min-width:1.45em;height:1.45em;padding:0 .25em;border-radius:.3em;border:1px solid #9aa3ad;border-bottom-width:2px;background:#f7f7f7;color:#333;font:700 .72em var(--font);flex:none}
.qbtns{display:flex;gap:.5em;align-items:center;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:.35em;border:2px solid var(--pc);background:#fff;border-radius:.5em;padding:.3em .8em;font-weight:700}
.btn.pri{background:var(--pc);color:#fff}
.btn.pri kbd{background:rgba(255,255,255,.9)}
.btn.lite{border-color:#b9b2a2;color:#5a5348;font-weight:400;font-size:.9em}
.fb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.35em;text-align:center;padding:.4em;border-radius:.6em}
.fb .big{font-size:1.7em;font-weight:700;font-family:var(--tfont)}
.fb.okk{background:#eaf6ea}.fb.okk .big{color:var(--ok)}
.fb.ko{background:#fbecea}.fb.ko .big{color:var(--red)}
.fb .gain{font-size:1.3em;font-weight:700}
.fb .ra{font-size:1.35em}
.fb .ra .lab{font-size:.65em;color:var(--muted)}
.fb .ms{font-size:.9em;color:#7a3b00}
.wt{font-size:.85em;color:var(--muted)}
.qdet{flex:1 1 60%;min-height:0;display:flex;flex-direction:column;border:3px solid var(--pc);border-radius:.6em;background:#fff;overflow:hidden}
.qdet .dh{display:flex;align-items:center;gap:.5em;padding:.2em .6em;background:var(--pc);color:#fff;font-weight:700}
.qdet .dh .sp{margin-left:auto;font-weight:400;font-size:.85em}
.qdet .dbody{flex:1 1 auto;min-height:0;overflow:auto;padding:.4em .6em;text-align:center;line-height:1.35;user-select:text;-webkit-user-select:text}
.qdet .qbtns{padding:.4em;border-top:1px solid var(--line)}
.qdet.ko{border-color:var(--red)}
.qdet.ko .dh{background:var(--red)}
.wbar{position:relative;width:100%;height:2.1em;border-radius:.5em;background:#ece8dd;overflow:hidden;display:flex;align-items:center;justify-content:center}
.wbar i{position:absolute;left:0;top:0;bottom:0;background:#cfe0f5;transition:width .25s linear}
.wbar span{position:relative;font-size:.9em}
.cdline{margin:.3em 0}
/* constructions */
.sh{font-family:var(--tfont);font-weight:700;font-size:1.1em;margin-top:.3em}
.tlist{display:flex;flex-direction:column;gap:.35em}
.tcard{display:flex;align-items:center;gap:.5em;text-align:left;border:2px solid var(--line);background:#fff;border-radius:.6em;padding:.35em .5em;width:100%}
button.tcard:hover{border-color:var(--pc)}
.tcard .ic{width:2.2em;height:2.2em;flex:none}
.tcard.small .ic{width:1.7em;height:1.7em}
.tcard .c{display:inline-flex;align-items:center;gap:.15em;font-weight:700;color:#7a5c00;white-space:nowrap}
.tcard .tdsc{font-size:.8em;color:var(--muted);line-height:1.2}
.tcard.no{opacity:.5}
.tcard.off{opacity:.65;background:#faf8f2}
.tcard.cur{border-color:var(--pc);background:#eef4fb}
.desel{align-self:flex-end}
.bmsg{color:var(--red);font-size:.85em;min-height:1.2em}
/* fractions (comme Questions pour des champions) */
.frac{display:inline-flex;flex-direction:column;align-items:stretch;text-align:center;vertical-align:middle;font-size:.78em;line-height:1.08;margin:0 .06em}
.frac .nu{padding:0 .15em .05em;border-bottom:.075em solid currentColor}
.frac .de{padding:.05em .15em 0}
.bp{font-size:1.45em;font-weight:300;line-height:1}
.ovl{text-decoration:overline;text-decoration-thickness:.07em}
.stp{border-collapse:collapse;margin:0 auto}
.stp td{padding:.06em .18em;white-space:nowrap}
.stp .sl{text-align:right}
.stp .sr{text-align:left}
.ans{color:var(--red);font-weight:700}
.fbars{display:flex;flex-direction:column;align-items:center;gap:.25em}
.cA{color:#1f5fa8;font-weight:700}.cB{color:#c25b00;font-weight:700}.cC{color:#2e7d32;font-weight:700}.cD{color:#d81b60;font-weight:700}.cM{color:#00897b;font-weight:700}
.fin{font-weight:700;white-space:nowrap}
.xp{position:relative;display:inline-block}
.xp::after{content:"";position:absolute;left:-.12em;right:-.12em;top:52%;border-top:.085em solid currentColor;transform:rotate(-32deg)}
.pdec{white-space:nowrap}
.fl{display:flex;align-items:center;gap:.15em}
.frow{display:flex;align-items:center;justify-content:center;gap:1.6em;flex-wrap:wrap}
.sg{font-weight:700}
.nw{white-space:nowrap}
/* calcul d'un élève : une ligne par étape, chaque ligne (sauf la 1re) numérotée et cliquable */
.cdv{display:inline-flex;flex-direction:column;align-items:stretch;gap:.2em;color:#1a3f8a;text-align:left}
.cdr{display:flex;align-items:center;gap:.1em;padding:.1em .45em .1em .2em;border-radius:.5em;border:2px solid transparent;background:none;width:100%}
button.cdr{font:inherit;color:inherit;border-color:#d6dfeb;background:#f7f9fc}
button.cdr:hover{background:#d9e7f7;border-color:var(--pc)}
.cdr .cdc{display:inline-flex;align-items:center;white-space:nowrap}
.cdr .eq{display:inline-block;width:1.1em;text-align:center;flex:none}
.cdn{display:inline-flex;align-items:center;justify-content:center;width:1.5em;height:1.5em;border-radius:50%;background:#6b7480;color:#fff;font:700 .55em var(--font);flex:none;margin-right:.2em}
.cdr.q0 .cdn,.cdr.q0 .eq{visibility:hidden}
.zl .cdv{row-gap:.3em}
.cdline + .cdcols{margin-top:.2em}
.cdcols{display:flex;flex-wrap:wrap;justify-content:center;gap:.4em 1.6em}
.cdr.bad .cdc{color:var(--red);text-decoration:line-through;text-decoration-thickness:.08em}
.cdr.bad .cdn{background:var(--red)}
.cdr.gry{opacity:.45}
.cdv .op{margin:0 .2em}
.note{color:var(--muted);font-size:.85em}
/* fenêtres */
.ov{position:fixed;inset:0;background:rgba(20,26,33,.72);display:flex;align-items:center;justify-content:center;z-index:50;padding:1em;font-size:var(--fs,15px)}
.ov[hidden]{display:none}
.card{background:var(--panel);border-radius:.8em;box-shadow:0 10px 40px rgba(0,0,0,.4);max-width:min(1250px,96vw);max-height:96vh;overflow:auto;padding:1em 1.3em;font-size:1.05em}
.card h1,.card h2{font-family:var(--tfont);margin:.1em 0 .4em}
.card h1{font-size:1.8em;text-align:center}
.mapc{border:3px solid transparent;border-radius:.6em;background:#fff;padding:.25em;display:flex;flex-direction:column;align-items:center;gap:.2em;font-weight:700}
.mapc.sel{border-color:var(--accent);box-shadow:0 0 0 3px #1f5fa855}
.go{display:flex;justify-content:center;gap:.8em;margin-top:.7em}
.go .btn{font-size:1.25em;padding:.35em 1.4em}
.thm{text-align:center;color:var(--muted);font-size:.85em;margin-top:.5em}
.sub{color:var(--muted);text-align:center;margin:-.2em 0 .6em}
.res{display:flex;flex-direction:column;gap:.3em;align-items:center;font-size:1.2em}
/* améliorations permanentes : 3 cartes en fin de partie, liste « Mes améliorations » */
.ready{font-weight:700;color:var(--ok)}
.upw{display:flex;justify-content:center;gap:1em;flex-wrap:wrap;margin:.5em 0 .9em}
.upc{width:13em;background:#fff;border:3px solid var(--bc,#d9d6cc);border-radius:.8em;padding:.6em .7em .7em;display:flex;flex-direction:column;align-items:center;gap:.2em;text-align:center;box-shadow:0 4px 0 var(--bc,#d9d6cc)}
.upc.new{animation:upin .5s backwards}
.upc.new:nth-child(2){animation-delay:.25s}.upc.new:nth-child(3){animation-delay:.5s}
@keyframes upin{from{transform:translateY(1em) scale(.8);opacity:0}}
.upc svg.ug{width:3em;height:3em}
.upc .un{font-family:var(--tfont);font-weight:700;font-size:1.1em}
.upc .uv{font-size:1.7em;font-weight:700;color:var(--bc)}
.upc .ud{font-size:.85em;color:var(--muted);line-height:1.2}
.upc .ut{font-size:.85em;font-weight:700}
.upl{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.5em}
.upl .upc{width:auto;flex-direction:row;text-align:left;padding:.35em .5em;box-shadow:none;border-width:2px;gap:.5em}
.upl .upc svg.ug{width:2.2em;height:2.2em;flex:none}
.upl .upc .uv{font-size:1.15em}
.upl .upc.no{opacity:.45;border-color:var(--line)}
.upl .upc.no .uv{color:var(--muted);font-size:.9em;font-weight:400}
.uptxt{text-align:center;margin:.2em 0}
/* nouvelles questions : case du nombre manquant, vrai ou faux, images */
.qbox{display:inline-flex;align-items:center;justify-content:center;min-width:1.5em;height:1.7em;border:.1em dashed var(--pc);border-radius:.3em;color:var(--pc);font-weight:700;background:#eef4fb;margin:0 .1em}
.ch.vf{font-family:var(--tfont);font-weight:700;font-size:1.6em}
.ch.vf.v{color:var(--ok)}.ch.vf.f{color:var(--red)}
.zp.main{color:var(--ink);font-size:max(15px,1.15em);line-height:1.35}
.zx svg.qimg{display:block;flex:none}
/* espace enseignant */
.prof h2{display:flex;align-items:center;gap:.5em}
.prof section{border-top:1px solid var(--line);padding:.5em 0}
.prof label{display:inline-flex;align-items:center;gap:.3em;margin:.15em .7em .15em 0}
.prof .qr{width:9em;height:9em;flex:none}
.prof .lk{display:flex;gap:1em;align-items:center}
.prof .url{word-break:break-all;font-family:monospace;font-size:.85em;background:#f1eee6;padding:.3em .5em;border-radius:.3em;user-select:text;-webkit-user-select:text}
.prof table{border-collapse:collapse;font-size:.9em}
.prof td,.prof th{border:1px solid var(--line);padding:.15em .5em;text-align:center}
.prof th{background:#ece8dd}
.seg{display:inline-flex;border:2px solid var(--accent);border-radius:.5em;overflow:hidden}
.seg button{border:0;background:#fff;padding:.2em .7em}
.seg button.on{background:var(--accent);color:#fff}
.toast{position:fixed;left:50%;bottom:40%;transform:translateX(-50%);background:#2b3440;color:#fff;padding:.5em 1em;border-radius:.6em;z-index:80;pointer-events:none;opacity:0;transition:opacity .3s}
.toast.show{opacity:1}
/* menus autour d'un emplacement ou d'une tour */
#radial{position:absolute;inset:0;pointer-events:none;z-index:5}
#radial[hidden]{display:none}
.ri{position:absolute;width:var(--rs);height:var(--rs);border-radius:50%;border:3px solid #2b3440;background:radial-gradient(circle at 40% 35%,#fffdf6,#e9e2d0);pointer-events:auto;padding:0;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(0,0,0,.35);transition:transform .12s}
.ri:hover,.ri.hov{transform:scale(1.1);border-color:#f1c40f}
.ri img{width:92%;height:92%;object-fit:contain;margin-top:-16%}
.ri .ic{width:52%;height:52%;margin-top:-14%}
.ri .rc{position:absolute;bottom:-.55em;left:50%;transform:translateX(-50%);display:inline-flex;align-items:center;gap:.12em;background:#2b3440;color:#ffe9a8;border-radius:.8em;padding:.05em .45em;font-weight:700;font-size:calc(var(--rs) * .2);white-space:nowrap}
.ri.no{filter:grayscale(.85);opacity:.8}
.ri.no .rc{color:#ff9d8f}
.ri.max .rc{background:var(--ok);color:#fff}
.ri .pips{position:absolute;bottom:22%;left:50%;transform:translateX(-50%);display:flex;gap:.18em}
.ri .pips i{width:calc(var(--rs) * .09);height:calc(var(--rs) * .09);border-radius:50%;border:1px solid #7a5c00;background:#fff}
.ri .pips i.on{background:#f1c40f}
/* panneau de droite */
.ibox{border:2px solid var(--line);background:#fff;border-radius:.6em;padding:.4em .55em;display:flex;flex-direction:column;gap:.2em}
.ibox.cur{border-color:var(--pc);background:#eef4fb}
.ibox .c,.tcard .c{display:inline-flex;align-items:center;gap:.15em;font-weight:700;color:#7a5c00;white-space:nowrap}
.ibox .c.no{color:var(--red)}
.ibox .tdsc b{color:var(--ok)}
/* départ : cartes par niveau */
.tiers{display:grid;grid-template-columns:repeat(3,1fr);gap:.8em}
.tier{background:#f1eee6;border-radius:.6em;padding:.4em}
.tier .tt{font-family:var(--tfont);font-weight:700;text-align:center;margin-bottom:.3em}
.tier .tt small{display:block;font-family:var(--font);font-weight:400;font-size:.75em;color:var(--muted)}
.tmaps{display:grid;grid-template-columns:1fr 1fr;gap:.4em}
.tier.locked .tt{opacity:.7}
.mapc small{font-weight:400;font-size:.75em;color:var(--muted);min-height:1.2em;text-align:center}
.mimg{position:relative;display:block;width:100%}
.mimg canvas{display:block;width:100%;aspect-ratio:32/22;border-radius:.4em;background:#ccc}
.mapc.lockd canvas{filter:grayscale(1) brightness(.75)}
.mapc.lockd{opacity:.85}
.mimg .lock{position:absolute;left:50%;top:50%;width:34%;height:auto;transform:translate(-50%,-50%);filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}
.mimg .crown{position:absolute;right:4%;top:4%;width:22%;height:auto;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
h1.win{color:#7a5c00;display:flex;align-items:center;justify-content:center;gap:.3em}
h1.win .crown{width:1.3em;height:1.3em}
.unl{background:#fff2c2;border:2px solid #f1c40f;border-radius:.6em;padding:.4em .8em;margin:.3em auto .7em;max-width:40em}

</style>
</head>
<body>
<div id="app">
<header id="top"><span class="ttl">Castle defense<small id="mapName"></small></span>
<div class="mid"><span class="wv" id="wv"></span><span class="nx" id="nx"></span><span class="hp"><span id="hpi"></span><span class="hpb" id="hpb"><i></i></span><span id="hpt"></span></span>
<span class="pill" id="gold" title="Or : pour construire pendant la partie"><b>0</b></span><span id="stk"></span></div>
<div class="btns"><button class="ib" id="bSnd" title="Son"></button><button class="ib" id="bFull" title="Plein écran"></button><button class="ib" id="bMenu"></button></div></header>
<aside id="qpane"></aside>
<div id="stage"><canvas id="cv"></canvas><div id="radial" hidden></div><div id="banner"></div></div>
<aside id="shop"></aside>
</div>
<div class="ov" id="ovStart" hidden></div><div class="ov" id="ovOver" hidden></div><div class="ov" id="ovUps" hidden></div><div class="ov" id="ovPause" hidden></div><div class="ov" id="ovProf" hidden></div>
<div class="toast" id="toast"></div>
<script>
//@@ qpcfra.js
"use strict";
const I = v => ({k: 'i', v});

  switch (kind){
    case 'est': return cdEst(lv, fl, R ? [R.op] : ops);
    case 'err': return cdErr(lv, fl, R ? [R.op] : ops, R ? R.bad : undefined);
    case 'miss': return cdMiss(lv, fl, R ? [R.op] : ops);
    case 'vf': return cdVF(lv, fl, R ? [R.op] : ops);
    case 'img': return cdImg(lv, R && R.v);
    case 'cmp': return cdCmp(lv, R && R.v);

}
function cdNext(pl, cfg){
  const lo = Math.floor(pl.lmin || 1), hi = Math.floor(pl.lmax || 4.99), base = Math.max(lo, Math.min(hi, Math.floor(pl.lvl))), fl = {rel: !!cfg.rel, dec: !!cfg.dec};
  const hard = base < hi && chance(pl.pHard || 0), lv = base + (hard ? 1 : 0), K = cfg.kinds.filter(k => CD_KINDS[k]);
  const calcs = K.filter(k => CD_KINDS[k].calc), tasks = K.filter(k => TASKS.includes(k)), br = K.filter(k => BREATH.includes(k));
  const ops = (calcs.length ? calcs : ['Mfra+', 'Mfra−', 'Mfra∙', 'Mfra:']).map(k => k.slice(4));
  pl.retry = (pl.retry || []).filter(R => K.includes(R.kind) && (!R.op || ops.includes(R.op)));
  let q = null, qh = hard;
  const R = pl.retry[0], lastK = pl.hist.length ? pl.hist[pl.hist.length - 1] : '';
  if (R && chance(RETRY_P) && !(BREATH.includes(R.kind) && BREATH.includes(lastK))){   // la question semblable : même famille, au niveau de la question ratée
    const rl = Math.max(lo, Math.min(BREATH.includes(R.kind) ? 3 : hi, R.lv || lv));
    q = cdGen(R.kind, rl, fl, ops, R);
    if (q){ q.again = true; qh = !BREATH.includes(q.kind) && rl > base; }
  }
  if (!q){
    const last = pl.hist.length ? pl.hist[pl.hist.length - 1] : '';
    let breath = false;
    if (br.length && calcs.length + tasks.length){     // une sur trois, corrigé d'après la partie (en retard : plus de chances), jamais beaucoup à la suite
      const nT = pl.sT || 0, nB = pl.sB || 0, H = pl.hist, k1 = BREATH.includes(last), k2 = k1 && H.length > 1 && BREATH.includes(H[H.length - 2]);
      let gap = 0; for (let i = H.length - 1; i >= 0 && !BREATH.includes(H[i]); i--) gap++;
      let p = Math.min(.9, Math.max(.05, BREATH_P + .25 * (BREATH_P * nT - nB))); if (k1) p *= .5;
      breath = k2 ? false : gap >= 6 && H.length >= 6 ? true : chance(p); }
    else breath = !!br.length;
    let kind;
    if (breath){ kind = least(pl, br); q = cdGen(kind, brLevel(base, kind), fl, ops); qh = false; }
    else {
      const lastTask = TASKS.includes(last);
      if (tasks.length && (!calcs.length || (!lastTask && chance(TASK_P)))) kind = least(pl, tasks); else kind = least(pl, calcs);
      q = cdGen(kind, lv, fl, ops);
    }
  }
  if (!q){ q = cdCalc(least(pl, calcs.length ? calcs : ['Mfra+']), lv, fl); qh = hard; }
  pl.hist.push(q.kind); if (pl.hist.length > 20) pl.hist.shift(); pl.cnt[q.kind] = (pl.cnt[q.kind] || 0) + 1;
  pl.sT = (pl.sT || 0) + 1; if (BREATH.includes(q.kind)) pl.sB = (pl.sB || 0) + 1;
  cdMark(q.key);
  if (q.choices){ q.ui = q.ui || 'qcm'; q.qcm = {choices: q.choices, ans: q.ans}; }
  else { q.ui = 'qcm'; q.qcm = cdChoices(q.r, q.dis || [], 4); }
  q.breath = BREATH.includes(q.kind); q.gold = CD_GOLD[q.lv]; q.hard = qh;

}
function least(pl, list){ const m = Math.min(...list.map(k => pl.cnt[k] || 0)); return pick(list.filter(k => (pl.cnt[k] || 0) === m)); }
// après la réponse : une erreur (ou « Voir la réponse ») garde la famille pour plus tard ; une bonne réponse dans la famille l'enlève
function cdRetry(pl, q, ok){
  pl.retry = pl.retry || [];
  if (ok){ pl.retry = pl.retry.filter(R => R.fam !== q.fam); return; }
  if (pl.retry.some(R => R.fam === q.fam)) return;
  pl.retry.push({fam: q.fam, kind: q.kind, op: q.op, bad: q.bad, lv: q.lv, v: q.v}); if (pl.retry.length > RETRY_MAX) pl.retry.shift();
}

/* ---------- difficulté automatique (par joueur, entre les bornes de la carte) ----------
   monte vite au début (+0,5 par bonne réponse pendant les 6 premières questions), puis +0,34 après deux bonnes réponses de suite
   (+0,12 pour une bonne réponse isolée) ; redescend moins vite qu'elle ne monte (−0,25 par erreur, sauf sur une question « plus dure »).
   Niveau = partie entière. */
const DIF = {up0: .5, nFast: 6, up: .34, upLone: .12, down: .25, min: 1, max: 4.99};
function cdAdapt(pl, ok, hard){
  const lo = pl.lmin || DIF.min, hi = pl.lmax || DIF.max;
  pl.nAns = (pl.nAns || 0) + 1;
  if (!ok && hard){ pl.stk = 0; return; }
  if (ok){ pl.stk = (pl.stk || 0) + 1; pl.lvl = Math.min(hi, pl.lvl + (pl.nAns <= DIF.nFast ? DIF.up0 : pl.stk >= 2 ? DIF.up : DIF.upLone)); }
  else { pl.stk = 0; pl.lvl = Math.max(lo, pl.lvl - DIF.down); }
}

function catmull(P, step){
  const out = [];
  for (let i = 0; i < P.length - 1; i++){
    const p0 = P[Math.max(0, i - 1)], p1 = P[i], p2 = P[i + 1], p3 = P[Math.min(P.length - 1, i + 2)];
    const L = Math.hypot(p2[0] - p1[0], p2[1] - p1[1]), n = Math.max(2, Math.ceil(L / step));
    for (let k = 0; k < n; k++){ const t = k / n, t2 = t * t, t3 = t2 * t;
      const f = j => .5 * ((2 * p1[j]) + (-p0[j] + p2[j]) * t + (2 * p0[j] - 5 * p1[j] + 4 * p2[j] - p3[j]) * t2 + (-p0[j] + 3 * p1[j] - 3 * p2[j] + p3[j]) * t3);
      out.push([f(0), f(1)]); }
  }
  out.push(P[P.length - 1].slice()); return out;
}

};

  let lo = 0, hi = cum.length - 1; while (hi - lo > 1){ const m = (lo + hi) >> 1; if (cum[m] <= s) lo = m; else hi = m; }
  const a = pts[lo], b = pts[hi], seg = (cum[hi] - cum[lo]) || 1, t = (s - cum[lo]) / seg;
  const dx = (b[0] - a[0]) / seg, dy = (b[1] - a[1]) / seg;

};
SIM.nearest = function(path, x, y){ let m = 1e9, sBest = 0;

    const vx = b[0] - a[0], vy = b[1] - a[1], L2 = vx * vx + vy * vy || 1, t = Math.max(0, Math.min(1, ((x - a[0]) * vx + (y - a[1]) * vy) / L2));

SIM.slots = function(paths){

    ups[u.id] = Math.round((cur + add) * 100) / 100;
    out.push({id: u.id, add, total: ups[u.id], first: !cur, max: ups[u.id] >= u.cap - 1e-9});
  }

};
SIM.mods = function(ups){
  const g = id => (ups && ups[id]) || 0;

    dmg: 1 + g('dmg') / 100, rate: 1 + g('rate') / 100, rangeMul: 1 + g('rng') / 100, costMul: 1 - g('cost') / 100, enSpd: 1 - g('slow') / 100,
    wait: SIM.WAIT, goldMul: 1 + g('gold') / 100, streakMul: 1 + g('stk') / 100, rainMul: 1 + g('rain') / 100, frz: g('frz') > 0, frzT: g('frz'), cdMul: 1 - g('cd') / 100};
};

/* ---------- vagues : 20 par partie, environ 10 minutes ; cartes de niveau 2 et 3 : plus d'ennemis ---------- */
SIM.NW = 20; SIM.WAVE_T0 = 8; SIM.WAVE_P = 25;
// plus d'or par question (21.11.2026) : plus d'ennemis et plus de vie pour compenser (avant : HPS 0,40, 4 + 0,9 n), réglés avec le robot
SIM.HPS = .50; SIM.HPC = 1.105;
SIM.WCNT = [5, 1.1];                                    // ennemis d'une vague : (5 + 1,1 n) ∙ facteur de la carte
SIM.TIERM = {cnt: [0, 1, 1.35, 1.8], hp: [0, 1, 1.35, 1.85]};
SIM.hpMul = (n, t) => SIM.HPS * Math.pow(SIM.HPC, n - 1) * (1 + .035 * (n - 1)) * SIM.TIERM.hp[t || 1];
SIM.waveList = function(n, rnd, tier){
  const cnt = Math.round((SIM.WCNT[0] + n * SIM.WCNT[1]) * SIM.TIERM.cnt[tier || 1]), L = [];
  for (let i = 0; i < cnt; i++){
    const w = [['gob', 1], ['wolf', n >= 2 ? .5 : 0], ['kni', n >= 4 ? .3 + .02 * n : 0], ['bat', n >= 6 ? .35 : 0]];
    let t = rnd() * w.reduce((a, b) => a + b[1], 0), k = 'gob'; for (const [x, p] of w){ t -= p; if (t < 0){ k = x; break; } }
    L.push(k);
  }
  if (n % 5 === 0) for (let i = 0; i < (n === SIM.NW ? 2 : 1) + (tier >= 3 && n >= 15 ? 1 : 0); i++) L.push('ogre');
  return L;
};
SIM.gap = n => Math.max(.8, 1.4 - .03 * n);
SIM.openPaths = n => SIM.OPEN.map((w, i) => w <= Math.max(1, n) ? i : -1).filter(i => i >= 0);

/* ---------- partie ---------- */
SIM.newGame = function(mapIdx, pl, opts){
  opts = opts || {};
  const lay = SIM.layout(mapIdx), seed = opts.seed || ((Math.random() * 2 ** 31) >>> 0), m = SIM.mods(pl.ups || {});
  const G = {mapIdx, tier: lay.map.tier || 1, lay, paths: lay.paths, slots: lay.slots, seed, rnd: SIM.rng(seed), t: 0, over: false, won: false, speed: opts.speed || 1,
    wave: 0, nextWave: SIM.WAVE_T0, spawnQ: [], enemies: [], towers: lay.slots.map(() => null), soldiers: [], proj: [], fx: [], eid: 0, sid: 0, m,
    castle: {hp: 0, max: 0, cd: 0, hit: 0, shoot: m.castleShoot}, kills: 0, ev: [], pl};
  G.castle.hp = G.castle.max = 20 + m.castleHp;
  pl.gold = 100 + m.startGold; pl.spellCd = {rain: 0, frz: 0}; pl.kills = 0; pl.nOkG = 0; pl.nAnsG = 0;
  return G;
};
SIM.isOpen = (G, pi) => SIM.OPEN[pi] <= Math.max(1, G.wave);
SIM.speedOf = (G, pi) => G.paths[pi].len / SIM.TRAVEL;
SIM.nextList = G => G.wave >= SIM.NW ? [] : SIM.waveList(G.wave + 1, SIM.rng(G.seed + (G.wave + 1) * 7919), G.tier);
function spawnWave(G){
  const n = ++G.wave, L = SIM.waveList(n, SIM.rng(G.seed + n * 7919), G.tier), gap = SIM.gap(n), open = SIM.openPaths(n);
  const newPath = SIM.OPEN.indexOf(n); if (newPath > 0){ G.pl.gold += SIM.OPEN_GOLD; G.ev.push({e: 'open', path: newPath, g: SIM.OPEN_GOLD}); }
  // les ennemis passent par les chemins ouverts à tour de rôle
  L.forEach((k, i) => G.spawnQ.push({t: G.t + Math.floor(i / open.length) * gap * open.length / Math.min(open.length, 2) + (i % open.length) * .35, k, n, path: open[(i + n) % open.length]}));
  G.spawnQ.sort((a, b) => a.t - b.t);
  G.nextWave = n >= SIM.NW ? Infinity : G.t + SIM.WAVE_P;
  G.ev.push({e: 'wave', n});
  if (G.m.waveGold && n > 1){ G.pl.gold += G.m.waveGold; G.ev.push({e: 'gold', g: G.m.waveGold}); }
}
function addEnemy(G, pi, k, n){
  const T = SIM.ENEMY[k], hp = Math.round(T.hp * SIM.hpMul(n, G.tier));
  G.enemies.push({id: ++G.eid, k, path: pi, s: 0, off: (G.rnd() - .5) * .42, hp, max: hp, armor: T.armor, fly: !!T.fly, leak: T.boss && n < 10 ? 3 : T.leak,
    atk: T.atk * (1 + .06 * (n - 1)), spd: SIM.speedOf(G, pi) * T.spd * G.m.enSpd, slowF: 0, slowT: 0, frz: 0, dead: false, hit: 0, bob: G.rnd() * 6, blk: 0});
}
SIM.enemyPos = (G, e) => SIM.at(G.paths[e.path], e.s, e.off);
function damage(G, e, dmg, pierce){
  const a = e.armor * (pierce ? 1 - pierce : 1), d = Math.max(dmg * .2, dmg - a);
  e.hp -= d; e.hit = .12;
  if (e.hp <= 0 && !e.dead){ e.dead = true; G.kills++; G.pl.kills++; if (G.m.killGold){ G.kg = (G.kg || 0) + G.m.killGold; const w = Math.floor(G.kg + 1e-9); if (w){ G.pl.gold += w; G.kg -= w; } }
    G.ev.push({e: 'kill', k: e.k, x: SIM.enemyPos(G, e)}); }
}
SIM.newTower = (k, t) => ({k, up: Object.fromEntries(SIM.TOWER[k].up.map(u => [u, 0])), lvl: 1, inv: 0, cd: .3, ang: 0, anim: 0, born: t || 0});
SIM.upSum = tw => Object.values(tw.up).reduce((a, b) => a + b, 0);
SIM.visLvl = tw => 1 + (SIM.upSum(tw) >= 3) + (SIM.upSum(tw) >= 6);
// valeurs d'une tour (up : niveaux des améliorations ; m : arbre)
SIM.statsOf = function(k, up, m){
  const T = SIM.TOWER[k], g = u => up[u] || 0;
  if (k === 'bar') return {n: SIM.SOL.n[g('sol')], respawn: SIM.SOL.respawn[g('sol')], hp: T.hp * SIM.MULT[g('arm')], armor: g('arm'), dmg: T.dmg * SIM.MULT[g('dmg')] * m.dmg,
    hit: 1 / m.rate, range: T.range};
  return {dmg: T.dmg * (k === 'ice' ? 1 + .25 * g('cold') : SIM.MULT[g('dmg')]) * m.dmg, rate: T.rate * SIM.SPD[g('spd')] * m.rate, range: (T.range + SIM.RNG * g('rng')) * m.rangeMul,
    splash: k === 'can' ? T.splash + .08 * g('dmg') : k === 'ice' ? T.splash + .1 * g('cold') : 0, air: T.air,
    slow: k === 'ice' ? Math.min(.75, T.slow + .1 * g('cold')) : 0, slowT: k === 'ice' ? T.slowT + .3 * g('cold') : 0, pierce: T.pierce || 0, proj: T.proj};
};
SIM.towerStats = (G, tw) => SIM.statsOf(tw.k, tw.up, G.m);
SIM.buildCost = (G, k) => Math.round(SIM.TOWER[k].cost * G.m.costMul);
SIM.upCost = (G, k, l) => Math.round(SIM.TOWER[k].cost * SIM.UPC[l] * G.m.costMul);
// point de ralliement d'une caserne : le point de chemin le plus proche (chemins ouverts ou non)
SIM.rally = function(G, si){ const s = G.slots[si]; let best = null;
  G.paths.forEach((p, pi) => { const r = SIM.nearest(p, s.x, s.y); if (!best || r.d < best.d) best = {d: r.d, s: Math.min(p.len - .6, Math.max(.8, r.s)), path: pi}; });
  return best; };
function barracksSync(G, si){                      // soldats d'une caserne (création, amélioration, vente)
  const tw = G.towers[si], old = G.soldiers.filter(z => z.si === si);
  if (!tw || tw.k !== 'bar'){ old.forEach(z => { z.gone = true; releaseFoe(G, z); }); G.soldiers = G.soldiers.filter(z => !z.gone); return; }
  const S = SIM.towerStats(G, tw), R = tw.rally || (tw.rally = SIM.rally(G, si)), sl = G.slots[si];
  for (let k = 0; k < S.n; k++){
    let z = old[k];
    if (!z){ z = {id: ++G.sid, si, k, path: R.path, s: R.s + (k - (S.n - 1) / 2) * .4, off: (k % 2 ? .18 : -.18), x: sl.x, y: sl.y, hp: 0, max: 0, dead: false, resp: 0, cd: 0, foe: 0, walk: 0};
      G.soldiers.push(z); }
    z.s = R.s + (k - (S.n - 1) / 2) * .4;
    const f = z.max ? z.hp / z.max : 1; z.max = S.hp; z.hp = z.dead ? 0 : Math.max(1, S.hp * f); z.dmg = S.dmg; z.armor = S.armor;
  }
}
SIM.syncBarracks = (G, si) => barracksSync(G, si);
function releaseFoe(G, z){ if (z.foe){ const e = G.enemies.find(q => q.id === z.foe); if (e && e.blk === z.id) e.blk = 0; z.foe = 0; } }
SIM.soldierPost = (G, z) => SIM.at(G.paths[z.path], z.s, z.off);

SIM.step = function(G, dtReal){
  if (G.over) return;
  const dt = dtReal * G.speed; G.t += dt;
  if (G.t >= G.nextWave) spawnWave(G);
  while (G.spawnQ.length && G.spawnQ[0].t <= G.t){ const s = G.spawnQ.shift(); addEnemy(G, s.path, s.k, s.n); }
  // soldats
  for (const z of G.soldiers){
    if (z.dead){ z.resp -= dt; if (z.resp <= 0){ const S = SIM.towerStats(G, G.towers[z.si]); z.dead = false; z.hp = z.max = S.hp; z.x = G.slots[z.si].x; z.y = G.slots[z.si].y; } continue; }
    if (z.hit > 0) z.hit -= dt;
    let e = z.foe ? G.enemies.find(q => q.id === z.foe && !q.dead) : null;
    if (!e){ z.foe = 0;
      const [px, py] = SIM.soldierPost(G, z);
      for (const q of G.enemies){ if (q.dead || q.fly || q.path !== z.path || q.blk) continue; if (Math.abs(q.s - z.s) < .7 && SIM.isOpen(G, q.path)){ e = q; break; } }
      if (e){ z.foe = e.id; e.blk = z.id; }
      else { const d = Math.hypot(px - z.x, py - z.y); if (d > .02){ const v = Math.min(d, 1.6 * dt); z.x += (px - z.x) / d * v; z.y += (py - z.y) / d * v; z.walk += dt; } }
    }
    if (e){ const [ex, ey] = SIM.enemyPos(G, e), d = Math.hypot(ex - z.x, ey - z.y);
      if (d > .3){ const v = Math.min(d - .25, 1.6 * dt); z.x += (ex - z.x) / d * v; z.y += (ey - z.y) / d * v; z.walk += dt; }
      else { z.cd -= dt; if (z.cd <= 0){ z.cd = SIM.towerStats(G, G.towers[z.si]).hit; z.swing = .25; damage(G, e, z.dmg, 0); }
        z.hp -= Math.max(e.atk * .2, e.atk - z.armor) * dt * (e.frz > 0 ? 0 : 1); z.hit = .1;
        if (z.hp <= 0){ z.dead = true; z.resp = SIM.towerStats(G, G.towers[z.si]).respawn; releaseFoe(G, z); G.ev.push({e: 'sdead'}); } }
      if (e.dead){ releaseFoe(G, z); } }
    if (z.swing > 0) z.swing -= dt;
  }
  // ennemis
  for (const e of G.enemies){ if (e.dead) continue;
    if (e.frz > 0) e.frz -= dt;
    if (e.slowT > 0) e.slowT -= dt; else e.slowF = 0;
    if (e.hit > 0) e.hit -= dt;
    if (e.blk && !G.soldiers.some(z => z.id === e.blk && !z.dead)) e.blk = 0;
    const f = e.frz > 0 ? (SIM.ENEMY[e.k].boss ? .5 : 0) : e.blk ? 0 : 1 - e.slowF;
    e.s += e.spd * f * dt; e.bob += dt * 6 * (e.blk ? .5 : f);
    if (e.s >= G.paths[e.path].len){ e.dead = true; e.leaked = true; G.castle.hp -= e.leak; G.castle.hit = .4; G.ev.push({e: 'leak', n: e.leak, k: e.k, path: e.path}); }
  }
  // tours
  G.slots.forEach((sl, si) => { const tw = G.towers[si]; if (!tw || tw.k === 'bar') return;
    tw.cd -= dt; if (tw.anim > 0) tw.anim -= dt; if (tw.cd > 0) return;
    const S = SIM.towerStats(G, tw); let best = null, bs = -1;
    for (const e of G.enemies){ if (e.dead || (e.fly && !S.air)) continue;
      const [x, y] = SIM.enemyPos(G, e); if (Math.hypot(x - sl.x, y - sl.y) > S.range) continue;
      const sc = e.s / G.paths[e.path].len; if (sc > bs){ bs = sc; best = e; } }
    if (!best) return;
    tw.cd = 1 / S.rate; tw.anim = .25;
    const [x, y] = SIM.enemyPos(G, best); tw.ang = Math.atan2(y - sl.y, x - sl.x);
    let tx = x, ty = y; if (tw.k === 'can' && !best.blk){ const f = best.frz > 0 ? 0 : 1 - best.slowF; [tx, ty] = SIM.at(G.paths[best.path], best.s + best.spd * f * S.proj, best.off); }
    G.proj.push({k: tw.k, x0: sl.x, y0: sl.y, tx, ty, target: best.id, t: 0, dur: S.proj, dmg: S.dmg, splash: S.splash, slow: S.slow, slowT: S.slowT, pierce: S.pierce, air: S.air});
  });
  // château
  const C = G.castle; if (C.hit > 0) C.hit -= dt;
  if (C.shoot > 0){ C.cd -= dt; if (C.cd <= 0){ let best = null, bd = 2.9;
    for (const e of G.enemies){ if (e.dead) continue; const [x, y] = SIM.enemyPos(G, e), d = Math.hypot(x - SIM.CASTLE[0], y - SIM.CASTLE[1]); if (d < bd){ bd = d; best = e; } }
    if (best){ C.cd = 1.2; G.proj.push({k: 'arc', x0: SIM.CASTLE[0], y0: SIM.CASTLE[1], z0: 1.6, tx: 0, ty: 0, target: best.id, t: 0, dur: .25, dmg: C.shoot, splash: 0, air: true, castle: true}); } } }
  // tirs
  for (const p of G.proj){ if (p.done) continue;
    p.t += dt; if (p.k !== 'can'){ const e = G.enemies.find(z => z.id === p.target && !z.dead); if (e){ const [x, y] = SIM.enemyPos(G, e); p.tx = x; p.ty = y; } }
    if (p.t < p.dur) continue; p.done = true;
    const hitOne = e => { damage(G, e, p.dmg, p.pierce); if (p.slow){ e.slowF = Math.max(e.slowF, p.slow); e.slowT = p.slowT; } };
    if (p.splash){ for (const e of G.enemies){ if (e.dead || (e.fly && !p.air)) continue; const [x, y] = SIM.enemyPos(G, e); if (Math.hypot(x - p.tx, y - p.ty) <= p.splash) hitOne(e); }
      G.fx.push({k: p.k === 'can' ? 'boom' : 'frost', x: p.tx, y: p.ty, r: p.splash, t: 0, dur: .45}); }
    else { const e = G.enemies.find(z => z.id === p.target && !z.dead); if (e) hitOne(e); }
  }
  for (const f of G.fx){ f.t += dt;
    if (f.k === 'rain' && !f.done && f.t >= .8){ f.done = true; for (const e of G.enemies){ if (e.dead) continue; const [x, y] = SIM.enemyPos(G, e); if (Math.hypot(x - f.x, y - f.y) <= f.r) damage(G, e, f.dmg); } } }
  G.enemies = G.enemies.filter(e => !e.dead || (e.dieT = (e.dieT || 0) + dt) < .35 && !e.leaked);
  G.proj = G.proj.filter(p => !p.done);
  G.fx = G.fx.filter(f => f.t < f.dur);
  G.pl.spellCd.rain = Math.max(0, G.pl.spellCd.rain - dt); G.pl.spellCd.frz = Math.max(0, G.pl.spellCd.frz - dt);
  if (C.hp <= 0){ C.hp = 0; G.over = true; G.ev.push({e: 'over'}); return; }
  // victoire : la dernière vague est passée et tous les ennemis sont partis
  if (G.wave >= SIM.NW && !G.spawnQ.length && !G.enemies.some(e => !e.dead)){ G.over = true; G.won = true; G.ev.push({e: 'won'}); }
};

/* ---------- actions (renvoient un message ou null) ---------- */
SIM.actions = function(G, si){
  const pl = G.pl, A = [], m = G.m;
  if (si != null && G.slots[si]){
    const tw = G.towers[si];
    if (!tw) SIM.TKEYS.forEach(k => A.push({a: 'build', k, cost: SIM.buildCost(G, k), lab: SIM.TOWER[k].name}));
    else { SIM.TOWER[tw.k].up.forEach(u => { const l = tw.up[u];
        A.push(l < SIM.UPMAX ? {a: 'upg', k: tw.k, u, l, cost: SIM.upCost(G, tw.k, l), lab: SIM.UPNAME[u]} : {a: 'upg', k: tw.k, u, l, max: true, cost: 0, lab: SIM.UPNAME[u]}); });
      A.push({a: 'sell', cost: -Math.round(tw.inv * SIM.SELL), lab: 'Vendre'}); }
  }
  A.push({a: 'rain', cost: SIM.SPELL.rain.cost, lab: SIM.SPELL.rain.name, cd: pl.spellCd.rain});
  if (m.frz) A.push({a: 'frz', cost: SIM.SPELL.frz.cost, lab: SIM.SPELL.frz.name, cd: pl.spellCd.frz});
  A.push({a: 'repair', cost: SIM.REPAIR.cost, lab: 'Réparer le château (+' + (SIM.REPAIR.hp + m.repairPlus) + ')', full: G.castle.hp >= G.castle.max});
  A.forEach(x => { x.ok = x.a === 'sell' || (!x.max && (x.cost <= pl.gold) && !(x.cd > 0) && !x.full); });
  return A;
};
SIM.act = function(G, si, A){
  const pl = G.pl, m = G.m;
  if (!A || !A.ok) return A && A.max ? 'max' : 'pas assez d\'or';
  if (A.a === 'build'){ if (G.towers[si]) return 'occupé'; pl.gold -= A.cost; const tw = G.towers[si] = SIM.newTower(A.k, G.t); tw.inv = A.cost; if (A.k === 'bar') barracksSync(G, si); G.ev.push({e: 'build', si}); }
  else if (A.a === 'upg'){ const tw = G.towers[si]; if (!tw || tw.up[A.u] >= SIM.UPMAX) return 'max'; pl.gold -= A.cost; tw.inv += A.cost; tw.up[A.u]++;
    const v = SIM.visLvl(tw); if (v !== tw.lvl){ tw.lvl = v; tw.born = G.t; } if (tw.k === 'bar') barracksSync(G, si); G.ev.push({e: 'up', si}); }
  else if (A.a === 'sell'){ const tw = G.towers[si]; if (!tw) return 'vide'; pl.gold += -A.cost; G.towers[si] = null; barracksSync(G, si); G.ev.push({e: 'sell', si}); }
  else if (A.a === 'rain'){ let bx = null, bn = -1;
    for (const e of G.enemies){ if (e.dead) continue; const [x, y] = SIM.enemyPos(G, e); let n = 0;
      for (const f of G.enemies){ if (f.dead) continue; const [u, v] = SIM.enemyPos(G, f); if (Math.hypot(u - x, v - y) <= SIM.SPELL.rain.r) n++; }
      const pr = e.s / G.paths[e.path].len; if (n > bn || (n === bn && pr > bx.pr)){ bn = n; bx = {x, y, pr}; } }
    if (!bx) return 'aucun ennemi';
    pl.gold -= A.cost; pl.spellCd.rain = SIM.SPELL.rain.cd * m.cdMul;
    G.fx.push({k: 'rain', x: bx.x, y: bx.y, r: SIM.SPELL.rain.r, dmg: SIM.SPELL.rain.dmg * m.rainMul * (1 + .06 * (G.wave - 1)), t: 0, dur: 1.3}); }
  else if (A.a === 'frz'){ if (!G.enemies.some(e => !e.dead)) return 'aucun ennemi';
    pl.gold -= A.cost; pl.spellCd.frz = SIM.SPELL.frz.cd * m.cdMul;
    G.enemies.forEach(e => { if (!e.dead) e.frz = m.frzT; });
    G.fx.push({k: 'frzall', t: 0, dur: m.frzT}); }
  else if (A.a === 'repair'){ if (G.castle.hp >= G.castle.max) return 'plein'; pl.gold -= A.cost; G.castle.hp = Math.min(G.castle.max, G.castle.hp + SIM.REPAIR.hp + m.repairPlus); G.ev.push({e: 'repair'}); }
  return null;
};

/* =====================================================================

const RD = {cv: null, cx: null, W: 0, H: 0, dpr: 1, U: 20, ox: 0, oy: 0, bg: null, key: '', spr: {}, t: 0, sel: null, hover: null};
const THEME = {

/* ---------- questions (à gauche), tout à la souris ---------- */
function nextQ(){ const u = APP.u; u.q = cdNext(APP.pl, APP.cfg); u.st = 'q'; u.pick = null; u.waitT = 0; qRender(); }
function answer(k){
  const u = APP.u, p = APP.pl, G = APP.G, q = u.q; if (u.st !== 'q' || !q) return;
  const ok = k === q.qcm.ans;
  const st = p.stats[q.kind] = p.stats[q.kind] || {n: 0, ok: 0, vu: 0}; st.n++; p.nAns++; p.nAnsG++;
  if (!q.breath) cdAdapt(p, ok, q.hard);              // les questions pour souffler ne changent pas la difficulté
  cdRetry(p, q, ok); u.pick = k;
  if (ok){ st.ok++; p.nOk++; p.nOkG++; u.streak++;
    const bonus = streakBonus(u.streak), g = Math.round(q.gold * G.m.goldMul) + bonus;
    p.gold += g; u.st = 'ok'; u.okT = .9; u.fb = {g, bonus}; SND.ok(); bumpEl('#gold'); }
  else { u.streak = 0; u.st = 'ko'; u.waitT = G.m.wait; u.wait0 = G.m.wait; u.fb = {ms: q.ui === 'qcm' || q.ui === 'vf' ? cdWhy(q, k) : null}; SND.ko(); }
  qRender(); shopRender(); radialRender(); save();
}
// or d'une bonne réponse : selon la difficulté de la question, « Savant », bonus de série (cdStreak : 1 par bonne réponse de suite dès la 3e, 5 au plus)
const streakBonus = n => cdStreak(n, APP.G.m.streakMul);
const goldFor = q => Math.round(q.gold * APP.G.m.goldMul) + streakBonus(APP.u.streak + 1);
function showAnswer(){                              // « Voir la réponse » : pas de pénalité, mais on ne répond plus ; la sorte de question reviendra
  const u = APP.u, p = APP.pl, q = u.q; if (u.st !== 'q' || !q) return;
  const st = p.stats[q.kind] = p.stats[q.kind] || {n: 0, ok: 0, vu: 0}; st.vu = (st.vu || 0) + 1;
  cdRetry(p, q, false); u.st = 'vu'; u.waitT = 0; qRender(); save();
}

function qBody(q, live){ return q.ui === 'lines' ? errH(q.e, {click: live}) : q.q; }

  const u = APP.u, q = u.q, B = $('#qpane'); if (!B || !q) return;

  let h = '';
  if (u.st === 'q') h += '<div class="gq" title="Or gagné si tu réponds juste">' + COIN + '<b>+' + goldFor(q) + '</b> si tu réponds juste</div>';
  if (!(det && q.ui === 'lines')) h += '<div class="qtop' + (det ? ' small' : '') + '"><div class="zp' + (q.big && !det ? ' main' : '') + '">' + (det ? (q.big ? q.prompt : 'Question :') : q.prompt) + '</div><div class="zx' + (q.ui === 'lines' ? ' zl' : '') + '">' + qBody(q, u.st === 'q') + '</div></div>';

    if (q.ui === 'vf') h += '<div class="qans"><div class="za">' + q.qcm.choices.map((c, k) => '<button class="ch vf ' + (k ? 'f' : 'v') + '" data-a="' + k + '">' + c.h + '</button>').join('') + '</div></div>';
    else if (q.ui === 'qcm') h += '<div class="qans"><div class="za">' + q.qcm.choices.map((c, k) => '<button class="ch' + (/frac/.test(c.h) || /^[−\d]+$/.test(c.h) ? '' : ' tx') + '" data-a="' + k + '">' + c.h + '</button>').join('') + '</div></div>';

  } else {

  const B = $('#qpane'), x = $('#qpane .zx'), box = $('#qpane .qtop'); if (!B) return;

/* ---------- boucle ---------- */
let LAST = 0, TOPT = 0, SAVET = 0;
// pas de pause (l'enseignant, 24.11.2026 : « Enlève la possibilité de mettre en pause en changeant d'onglet ou en cliquant sur pause ») : un onglet
// caché ou une fenêtre réduite ne reçoit plus d'images ; au retour, le jeu rattrape tout le temps passé (par pas de 1/12 s, comme le robot)
function loop(ts){
  requestAnimationFrame(loop);
  const dt = LAST ? Math.min(3600, Math.max(0, (ts - LAST) / 1000)) : 0; LAST = ts;
  const G = APP.G; if (!G || APP.state === 'start') return;
  if (APP.state === 'play' && !APP.paused){
    const h = dt > .25 ? 1 / 12 : 1 / 30;
    for (let s = dt; s > 1e-6 && !G.over; s -= h) SIM.step(G, Math.min(h, s));
    let wv = 0, og = 0, lk = false;           // après un rattrapage : une seule annonce de vague, un seul son
    G.ev.forEach(ev => { if (ev.e === 'wave') wv = ev.n; else if (ev.e === 'open') og = ev.g; else if (ev.e === 'leak') lk = true; });
    G.ev.length = 0;
    if (wv){ waveBanner(wv); shopRender(); } if (og){ openBanner(og); bumpEl('#gold'); } if (lk) SND.leak();
    const u = APP.u;
    if (u.st === 'ok'){ u.okT -= dt; if (u.okT <= 0) nextQ(); }
    if (u.waitT > 0){ u.waitT -= dt; if (u.waitT <= 0){ u.waitT = 0; qRender(); } }
    if (G.over) return gameOver(G.won);
  }
  const sel = APP.sel != null && G.slots[APP.sel] ? (() => { const tw = G.towers[APP.sel], it = APP.rhover != null ? radialItems()[APP.rhover] : null; let range = 0, rally = null, next = 0;
    if (tw && tw.k === 'bar') rally = tw.rally || SIM.rally(G, APP.sel); else if (tw){ range = SIM.towerStats(G, tw).range; if (it && it.u === 'rng' && !it.max) next = SIM.statsOf(tw.k, Object.assign({}, tw.up, {rng: tw.up.rng + 1}), G.m).range; }
    else if (it && it.a === 'build'){ if (it.k === 'bar') rally = SIM.rally(G, APP.sel); else range = SIM.statsOf(it.k, {}, G.m).range; }
    return {si: APP.sel, range, rally, next}; })() : null;
  try { rdFrame(G, {sel, hover: APP.hover}); } catch (e) { console.error(e); }
  if (ts - TOPT > 250){ TOPT = ts; topBar(); const u = APP.u, c = $('#qpane .cnt'), w = $('#qpane .wbar i'); if (c) c.textContent = Math.max(1, Math.ceil(u.waitT)); if (w) w.style.width = (100 * (1 - u.waitT / u.wait0)).toFixed(1) + '%'; shopTick(); }
  if (ts - SAVET > 3000){ SAVET = ts; if (APP.state === 'play') save(); }
}
let SHOPSIG = '', RADSIG = '';
function shopTick(){ const G = APP.G, A = SIM.actions(G, null), sig = A.map(a => a.ok + ':' + Math.ceil((a.cd || 0) / G.speed)).join('|') + G.pl.gold + '|' + G.wave + '|' + APP.sel + '|' + APP.rhover;
  if (sig !== SHOPSIG){ SHOPSIG = sig; shopRender(); } const r = radialSig(); if (r !== RADSIG){ RADSIG = r; radialRender(); } }
function topBar(){
  const G = APP.G; if (!G) return; const p = G.pl;
  $('#wv').textContent = G.wave ? 'Vague ' + G.wave + ' / ' + SIM.NW : 'Prépare-toi !';
  $('#nx').textContent = G.wave >= SIM.NW ? 'dernière vague' : 'prochaine dans ' + Math.max(0, Math.ceil((G.nextWave - G.t) / G.speed)) + ' s';
  const f = Math.max(0, G.castle.hp / G.castle.max); $('#hpb i').style.width = (f * 100) + '%'; $('#hpb').classList.toggle('low', f < .35);
  $('#hpt').textContent = Math.max(0, Math.ceil(G.castle.hp)) + '/' + G.castle.max;
  $('#gold b').textContent = p.gold;
  $('#stk').textContent = APP.u && APP.u.streak >= 3 ? 'série ×' + APP.u.streak : '';
}
let BT = 0;
function waveBanner(n){ const b = $('#banner'); b.innerHTML = 'Vague ' + n + ' / ' + SIM.NW + (n === SIM.NW ? '<small>Dernière vague : tiens bon !</small>' : n % 5 === 0 ? '<small>Un ogre arrive !</small>' : n === 4 ? '<small>Des chevaliers en armure : le canon et les soldats les arrêtent mieux.</small>' : n === 6 ? '<small>Des chauves-souris : le canon et les soldats ne les touchent pas.</small>' : '');
  b.classList.add('show'); SND.wave(); clearTimeout(BT); BT = setTimeout(() => b.classList.remove('show'), 2600); }
function openBanner(g){ setTimeout(() => { const b = $('#banner'); b.innerHTML = 'Un nouveau chemin s\'ouvre !<small>+' + g + ' or pour le défendre</small>'; b.classList.add('show'); clearTimeout(BT); BT = setTimeout(() => b.classList.remove('show'), 2800); }, 2700); }
let TT = 0;
function toast(t){ const e = $('#toast'); e.textContent = t; e.classList.add('show'); clearTimeout(TT); TT = setTimeout(() => e.classList.remove('show'), 1800); }

/* ---------- pause (seulement pendant l'espace enseignant), fin de partie (victoire ou défaite) ---------- */
function pauseGame(on, msg){
  if (APP.state !== 'play') return; APP.paused = on; const ov = $('#ovPause');
  ov.hidden = !on; if (on) ov.innerHTML = '<div class="card" style="text-align:center"><h2>' + (msg || 'Pause') + '</h2><div class="go"><button class="btn pri" data-resume="1">Reprendre</button></div></div>';
}
function gameOver(won){
  const G = APP.G, p = APP.pl, M = SIM.MAPS[APP.mapIdx]; APP.state = 'over'; APP.sel = null; radialRender();
  const prev = p.best[M.id] || 0; p.best[M.id] = Math.max(prev, G.wave); p.games = (p.games || 0) + 1; p.lvlD = p.lvl >= p.lmax - .02 ? Math.max(p.lvl, p.lvlD || 1) : p.lvl;     // au plafond de la carte : on garde le niveau d'avant s'il était plus haut
  let unl = [];
  if (won){ SND.win(); const before = SIM.MAPS.map((m, i) => mapOpen(i)); const first = !p.won[M.id]; p.won[M.id] = true; p.wins = (p.wins || 0) + 1;
    unl = SIM.MAPS.filter((m, i) => !before[i] && mapOpen(i)).map(m => m.name); if (!first) unl = []; }
  else SND.over();
  const w = SIM.passed(G), got = SIM.rollUps(p.ups, w);          // 3 améliorations au hasard, plus fortes avec les vagues passées
  ls.del(KEY_GAME); saveProg();
  const ov = $('#ovOver'); ov.hidden = false;
  ov.innerHTML = '<div class="card" style="text-align:center">' + (won ? '<h1 class="win">' + CROWN + ' Victoire ! Le château tient bon !</h1><div class="sub">' + M.name + ' · 20 vagues repoussées</div>' :
    '<h1>Le château est tombé !</h1><div class="sub">Vague ' + G.wave + ' / ' + SIM.NW + (G.wave > prev && prev ? ' · nouveau record !' : prev > G.wave ? ' · ton record ici : vague ' + prev : '') + '</div>') +
    (unl.length ? '<div class="unl">Nouvelles cartes débloquées : <b>' + unl.join(' et ') + '</b> (questions plus difficiles, plus d\'or, plus d\'ennemis)</div>' : '') +
    '<h2>' + (got.length ? 'Tes ' + got.length + ' nouvelles améliorations' : 'Toutes tes améliorations sont au maximum !') + '</h2>' +
    (got.length ? '<div class="uptxt note">' + (w >= SIM.NW ? '20 vagues passées : elles sont au plus fort.' : w + ' vague' + (w > 1 ? 's' : '') + ' passée' + (w > 1 ? 's' : '') + '. Plus tu tiens de vagues, plus elles sont fortes.') + ' Elles restent pour toutes tes parties.</div>' : '') +
    '<div class="upw">' + got.map(g => upCard(g.id, g.add, g)).join('') + '</div>' +
    '<div class="res" style="font-size:1em"><div>Bonnes réponses : <b>' + G.pl.nOkG + '</b></div></div>' +
    '<div class="go"><button class="btn" data-maps="1">Cartes</button><button class="btn" data-ups="1">Mes améliorations</button><button class="btn pri" data-replay="1">Rejouer (' + M.name + ')</button></div></div>';
}

/* ---------- améliorations permanentes : cartes et liste ---------- */
const BR_COL = {or: '#b07d00', ch: '#5d6b7a', to: '#c25b00', qu: '#1f5fa8', so: '#8e44ad'};
const TGLYPH = {or: '<circle r="11" fill="#f1c40f" stroke="#a27800" stroke-width="2.5"/><circle r="6" fill="none" stroke="#a27800" stroke-width="2"/>',
  ch: '<path d="M-12 12V-4h4v-6h5v6h6v-6h5v6h4v16z" fill="#fff" stroke="#3b4654" stroke-width="2"/><rect x="-3" y="3" width="6" height="9" fill="#3b4654"/>',
  to: '<path d="M-8 13h16l-2-14h-12z" fill="#fff" stroke="#5b3a1e" stroke-width="2"/><path d="M-11 -1h22l-11-12z" fill="#fff" stroke="#5b3a1e" stroke-width="2"/>',
  qu: '<rect x="-12" y="-12" width="24" height="24" rx="5" fill="#fff" stroke="#14406f" stroke-width="2"/><path d="M-5 -4a5 5 0 1 1 7 4.6c-1.6.7-2 1.6-2 3.4" fill="none" stroke="#14406f" stroke-width="3" stroke-linecap="round"/><circle cy="8.5" r="2" fill="#14406f"/>',
  so: '<path d="M0 -14l3.5 9 9.5 .5-7.5 6 2.5 9.5-8-5.5-8 5.5 2.5-9.5-7.5-6 9.5-.5z" fill="#fff" stroke="#5b2c6f" stroke-width="1.5"/>'};
const upGlyph = (br, em) => '<svg class="ug" viewBox="-20 -20 40 40" style="' + (em ? 'width:' + em + 'em;height:' + em + 'em;vertical-align:-.3em' : '') + '"><circle r="19" fill="' + BR_COL[br] + '"/>' + TGLYPH[br].replace(/#fff"/g, '#fffdf6"') + '</svg>';
const upNum = (u, v) => (u.neg ? '−' : '+') + fmtN(v) + (u.u === '%' ? ' %' : ' ' + u.u);
const tirTot = v => (SIM.CASTLE_DMG + v) + ' dégâts';                  // tir du château : dégâts d'un tir (4 + ce qui a été gagné)
function upCard(id, add, g){                           // g : ce qui vient d'être gagné (carte de fin de partie) ; sinon la carte d'une liste
  const u = SIM.upNode(id), tot = APP.pl.ups[id] || 0, first = g && g.first, totH = id === 'tir' ? tirTot(tot) + ' par tir' : upNum(u, tot).replace('+', '');
  if (g) return '<div class="upc new" style="--bc:' + BR_COL[u.br] + '">' + upGlyph(u.br) + '<div class="un">' + u.name + '</div><div class="uv">' + (first && id === 'frz' ? fmtN(add) + ' s' : first && id === 'tir' ? tirTot(add) : upNum(u, add)) + '</div>' +
    '<div class="ud">' + (first && u.d1 ? u.d1(add) : u.d) + '</div><div class="ut">' + (first ? 'nouvelle !' : 'en tout : ' + totH) + (g.max ? ' (maximum)' : '') + '</div></div>';
  return '<div class="upc' + (tot ? '' : ' no') + '" style="--bc:' + BR_COL[u.br] + '">' + upGlyph(u.br) + '<div><div class="un">' + u.name + ' <span class="uv">' + (tot ? totH : 'pas encore') + '</span>' +
    (tot >= u.cap - 1e-9 ? ' <span class="ready">max</span>' : '') + '</div><div class="ud">' + (id === 'tir' && tot ? u.d1(tot) : id === 'frz' && tot ? 'Sort Gel : tous les ennemis s’arrêtent ' + fmtN(tot) + ' s.' : u.d) + '</div></div></div>';
}
function showUps(){ APP.upsFrom = APP.state === 'start' ? 'start' : 'over'; $('#ovOver').hidden = true; $('#ovStart').hidden = true; $('#ovUps').hidden = false; renderUps(); }
function renderUps(){
  const p = APP.pl, n = SIM.UPG.filter(u => p.ups[u.id]).length;
  $('#ovUps').innerHTML = '<div class="card" style="width:min(62em,96vw);max-width:96vw"><h1>Mes améliorations</h1><div class="sub">' + n + ' sorte' + (n > 1 ? 's' : '') + ' sur ' + SIM.UPG.length +
    ' · tu en gagnes 3 au hasard à la fin de chaque partie ; plus tu tiens de vagues, plus elles sont fortes. Elles restent pour toutes tes parties.</div>' +
    '<div class="upl">' + SIM.UPG.map(u => upCard(u.id)).join('') + '</div>' +
    '<div class="go"><button class="btn" data-maps="1">Cartes</button><button class="btn pri" data-replay="1">' + (APP.upsFrom === 'start' ? 'Jouer' : 'Rejouer') + ' (' + SIM.MAPS[APP.mapIdx].name + ')</button></div></div>';
}
function replay(){ ['#ovUps', '#ovOver'].forEach(s => $(s).hidden = true); startGame(null); }
function toMaps(){ ['#ovUps', '#ovOver'].forEach(s => $(s).hidden = true); startScreen(); }

/* ---------- espace enseignant (taper « prof », ou appui long sur ☰) ---------- */
function openProf(){
  const was = APP.paused; if (APP.state === 'play' && !APP.paused) pauseGame(true, 'Pause (espace enseignant)'); APP.profPaused = !was;
  $('#ovProf').hidden = false; renderProf();
}
function closeProf(){ $('#ovProf').hidden = true; if (APP.profPaused && APP.state === 'play') pauseGame(false); APP.profPaused = false; if (APP.state === 'start') startScreen(); }
function renderProf(){
  const C = APP.cfg, url = linkFor(C), p = APP.pl;
  let qr = ''; try { qr = qrSVG(QR.make(url, 'M')); } catch (e) { qr = ''; }
  const st = '<tr>' + ALLK.map(k => { const s = p.stats[k]; return '<td>' + (s ? s.ok + '/' + s.n + (s.vu ? ' <span class="note">(' + s.vu + ' vues)</span>' : '') : '–') + '</td>'; }).join('') + '<td><b>' + p.nOk + '/' + p.nAns + '</b></td></tr>';
  const won = SIM.MAPS.filter(m => p.won[m.id]).map(m => m.name);
  $('#ovProf').innerHTML = '<div class="card prof" style="width:min(900px,96vw)"><h2>Espace enseignant<button class="ib" data-close="1" style="margin-left:auto;background:#3b4654">✕</button></h2>' +
    '<section><b>Thèmes</b> (les élèves ne peuvent pas les changer)' + [['Calculs', ALLK.slice(0, 4)], ['Autres questions', TASKS], ['Pour souffler (environ une question sur trois)', BREATH]].map(([t, L]) =>
      '<div>' + t + ' : ' + L.map(k => '<label><input type="checkbox" data-kind="' + k + '"' + (C.kinds.includes(k) ? ' checked' : '') + '>' + CD_KINDS[k].lab + '</label>').join('') + '</div>').join('') +
    '<label><input type="checkbox" data-opt="rel"' + (C.rel ? ' checked' : '') + '>nombres relatifs</label><label><input type="checkbox" data-opt="dec"' + (C.dec ? ' checked' : '') + '>nombres à virgule</label>' +
    '<div class="note">Les changements valent pour les questions suivantes.</div></section>' +
    '<section><b>Lien pour les élèves</b> (Google Classroom)<div class="lk"><div class="qr">' + qr + '</div><div><div class="url">' + url + '</div><p><button class="btn" data-copy="1">Copier le lien</button></p>' +
    '<div class="note">Le lien ouvre le jeu en ligne avec ces thèmes. Sur la clé USB, les thèmes cochés ici valent pour cet ordinateur.</div></div></div></section>' +
    '<section><b>Jeu</b><br>Vitesse : <span class="seg">' + [[.75, 'lente'], [1, 'normale'], [1.25, 'rapide']].map(([v, l]) => '<button data-speed="' + v + '" class="' + (APP.speed === v ? 'on' : '') + '">' + l + '</button>').join('') + '</span>' +
    '<label style="margin-left:1em"><input type="checkbox" data-snd="1"' + (APP.sound ? ' checked' : '') + '>son</label>' +
    '<label style="margin-left:1em"><input type="checkbox" data-unl="1"' + (p.unlockAll ? ' checked' : '') + '>toutes les cartes ouvertes (cet ordinateur)</label></section>' +
    '<section><b>Progrès sur cet ordinateur</b> · ' + (p.games || 0) + ' partie' + ((p.games || 0) > 1 ? 's' : '') + ' · ' + (p.wins || 0) + ' victoire' + ((p.wins || 0) > 1 ? 's' : '') + (won.length ? ' (' + won.join(', ') + ')' : '') + ' · ' + SIM.UPG.filter(u => p.ups[u.id]).length + ' sortes d\'améliorations<br>' +
    '<table><tr>' + ALLK.map(k => '<th>' + CD_KINDS[k].lab + '</th>').join('') + '<th>Total</th></tr>' + st + '</table>' +
    '<p><button class="btn" data-reset="1">Tout remettre à zéro (améliorations, cartes, statistiques)</button></p></section></div>';
}
function onProf(t){
  if (t.dataset.close){ closeProf(); return; }
  if (t.dataset.kind){ const k = t.dataset.kind; let ks = APP.cfg.kinds.filter(x => x !== k); if (t.checked) ks.push(k); ks = ALLK.filter(x => ks.includes(x)); if (!ks.length) ks = ['Mfra+']; APP.cfg.kinds = ks; renderProf(); saveCfg(); return; }
  if (t.dataset.opt){ APP.cfg[t.dataset.opt] = t.checked; renderProf(); saveCfg(); return; }
  if (t.dataset.speed){ APP.speed = +t.dataset.speed; if (APP.G) APP.G.speed = APP.speed; renderProf(); saveCfg(); return; }
  if (t.dataset.snd){ APP.sound = t.checked; $('#bSnd').innerHTML = APP.sound ? SVGI.snd : SVGI.mute; return; }
  if (t.dataset.unl){ APP.pl.unlockAll = t.checked; saveProg(); return; }
  if (t.dataset.copy){ const url = linkFor(APP.cfg); try { navigator.clipboard.writeText(url).then(() => toast('Lien copié')); } catch (e) { toast(url); } return; }
  if (t.dataset.reset){ if (Date.now() - (APP.resetArm || 0) > 4000){ APP.resetArm = Date.now(); toast('Clique encore une fois pour tout remettre à zéro'); return; } ls.del(KEY_PROG); ls.del(KEY_GAME); location.reload(); }
}

/* ---------- démarrage ---------- */
function fullscreen(){ const d = document, el = d.documentElement; if (!d.fullscreenElement && !d.webkitFullscreenElement){ const rq = el.requestFullscreen || el.webkitRequestFullscreen; if (rq){ const p = rq.call(el); if (p && p.catch) p.catch(() => {}); } } else { const ex = d.exitFullscreen || d.webkitExitFullscreen; if (ex) ex.call(d); } }
function init(){
  if (!CanvasRenderingContext2D.prototype.roundRect) CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r){ r = Math.min(r, w / 2, h / 2); this.moveTo(x + r, y); this.arcTo(x + w, y, x + w, y + h, r); this.arcTo(x + w, y + h, x, y + h, r); this.arcTo(x, y + h, x, y, r); this.arcTo(x, y, x + w, y, r); this.closePath(); return this; };
  RD.cv = $('#cv'); RD.cx = RD.cv.getContext('2d');
  $('#bSnd').innerHTML = SVGI.mute; $('#bFull').innerHTML = SVGI.full; $('#bMenu').innerHTML = SVGI.menu; $('#hpi').innerHTML = SVGI.heart;
  $('#gold').insertAdjacentHTML('afterbegin', COIN);
  OLD_KEYS.forEach(k => ls.del(k));
  const C = ls.get(KEY_CFG); if (C){ APP.cfg = C.cfg; APP.speed = C.speed || 1; if (!C.v) APP.cfg.kinds = ALLK.filter(k => APP.cfg.kinds.includes(k) || NEWK.includes(k)); }   // réglages d'avant le 21.11.2026 : nouvelles questions cochées
  readLink(); if (APP.link) saveCfg();
  const P = ls.get(KEY_PROG); APP.pl = newPlayer();
  if (P && (P.v === 3 || P.v === 4)){ PROG_FIELDS.forEach(f => { if (P[f] != null) APP.pl[f] = P[f]; }); (P.used || []).forEach(k => CDS.used.add(k)); TALLY = P.tally || {}; if (P.est && !Array.isArray(P.est)) EST_N = P.est; }
  APP.mapIdx = SIM.ORDER[0];
  const S = ls.get(KEY_GAME);
  if (S && S.v === 3 && Date.now() - S.ts < RESUME_MIN * 60000 && mapOpen(S.mapIdx)){ APP.mapIdx = S.mapIdx; startGame(S); } else { ls.del(KEY_GAME); startScreen(); }
  addEventListener('resize', layout); addEventListener('keydown', onKey);
  $('#qpane').addEventListener('click', onQClick); $('#shop').addEventListener('click', onShopClick);
  RD.cv.addEventListener('pointerdown', onCanvas); RD.cv.addEventListener('pointermove', onCanvasMove);
  $('#radial').addEventListener('click', onRadial); $('#radial').addEventListener('pointermove', onRadialMove); $('#radial').addEventListener('pointerleave', () => { if (APP.rhover != null){ APP.rhover = null; radialRender(); shopRender(); } });
  $('#ovStart').addEventListener('click', e => { const m = e.target.closest('[data-map]');
    if (m){ const i = +m.dataset.map; if (!mapOpen(i)){ toast('Gagne une carte du niveau ' + (SIM.MAPS[i].tier - 1) + ' pour ouvrir celle-ci'); return; }
      APP.mapIdx = i; document.querySelectorAll('.mapc').forEach(c => c.classList.toggle('sel', +c.dataset.map === APP.mapIdx)); }
    if (e.target.closest('[data-go]')) startGame(null); if (e.target.closest('[data-ups]')) showUps(); });
  $('#ovOver').addEventListener('click', e => { if (e.target.closest('[data-ups]')) showUps(); if (e.target.closest('[data-maps]')) toMaps(); if (e.target.closest('[data-replay]')) replay(); });
  $('#ovUps').addEventListener('click', e => { if (e.target.closest('[data-replay]')) replay(); if (e.target.closest('[data-maps]')) toMaps(); });
  $('#ovPause').addEventListener('click', e => { if (e.target.closest('[data-resume]')) pauseGame(false); });
  $('#ovProf').addEventListener('click', e => { if (e.target.id === 'ovProf') closeProf(); else { const b = e.target.closest('button'); if (b) onProf(b); } });
  $('#ovProf').addEventListener('change', e => onProf(e.target));
  $('#bSnd').onclick = () => { APP.sound = !APP.sound; $('#bSnd').innerHTML = APP.sound ? SVGI.snd : SVGI.mute; $('#bSnd').classList.toggle('on', APP.sound); };
  $('#bFull').onclick = fullscreen;
  let lp = 0; const bm = $('#bMenu');
  bm.addEventListener('pointerdown', () => { lp = setTimeout(() => { lp = -1; openProf(); }, 1200); });
  bm.addEventListener('pointerup', () => { if (lp > 0) clearTimeout(lp); lp = 0; });      // ☰ : seulement l'appui long (espace enseignant), plus de pause
  bm.addEventListener('pointerleave', () => { if (lp > 0) clearTimeout(lp); lp = 0; });
  document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });      // pas de pause : au retour, le jeu rattrape le temps passé (loop)
  addEventListener('beforeunload', () => { if (APP.G) save(); });
  layout(); requestAnimationFrame(loop);
}

init();
</script>
