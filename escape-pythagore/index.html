<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>L’atelier de Pythagore</title>
<style>
*{box-sizing:border-box}
html{font-size:clamp(14px, calc(0.5vw + 0.62vh + 4px), 34px)}
body{margin:0;background:#1b2430;color:#1d1d1d;font-family:Arial,"Liberation Sans",Helvetica,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
#app{display:flex;flex-direction:column;height:100vh}
#hud{display:flex;align-items:center;gap:.45em;padding:.3em .6em;background:#24364a;color:#fff;flex:0 0 auto}
#hud .title{flex:1 1 auto;min-width:0;font-family:"Century Gothic","URW Gothic","URW Gothic L","TeX Gyre Adventor",Futura,Arial,sans-serif;font-weight:bold;font-size:1.1em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-flex;align-items:center;gap:.3em;background:#33495f;border-radius:.6em;padding:.25em .6em;white-space:nowrap;font-variant-numeric:tabular-nums}
.btn{font:inherit;display:inline-flex;align-items:center;justify-content:center;gap:.35em;border:0;border-radius:.55em;padding:.35em .65em;background:#3a6fae;color:#fff;cursor:pointer;white-space:nowrap}
.btn:hover{background:#4a82c4}
.btn.on{background:#f9a825;color:#3e2700}
.btn.gray{background:#607d8b}.btn.ok{background:#2e7d32}.btn.warn{background:#c25b00}
.btn svg,.chip svg{width:1.2em;height:1.2em;flex:0 0 auto}
.btn .cost{font-size:.8em;opacity:.95}
#stage{position:relative;flex:1 1 auto;min-height:0;background:#1b2430;overflow:hidden}
#scene{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
#stage.loupe #scene{cursor:zoom-in}
.hot,[data-d],[data-hint],[data-take],[data-use],[data-act]{cursor:pointer}
.hot:hover,[data-take]:hover,[data-use]:hover{filter:drop-shadow(0 0 5px #ffe082) drop-shadow(0 0 10px #ffb300)}
[data-d]:hover>.ar{fill:#ffca28}
.anim{transform-box:fill-box;transform-origin:center}
.shake{animation:shk .45s}
@keyframes shk{0%,100%{transform:translateX(0) rotate(0)}20%{transform:translateX(-7px) rotate(-3deg)}40%{transform:translateX(7px) rotate(3deg)}60%{transform:translateX(-5px) rotate(-2deg)}80%{transform:translateX(4px) rotate(1deg)}}
.wiggle{animation:wig .6s}
@keyframes wig{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
.spin{animation:spn 1.2s ease-out}
@keyframes spn{to{transform:rotate(360deg)}}
.pop{animation:pp .5s}
@keyframes pp{50%{transform:scale(1.18)}}
.pulse{animation:pls .9s ease-in-out 3}
@keyframes pls{50%{filter:drop-shadow(0 0 10px #ffeb3b) drop-shadow(0 0 22px #ff9800)}}
.float{animation:flt 1.6s ease-out forwards;pointer-events:none}
@keyframes flt{from{transform:translateY(0);opacity:1}to{transform:translateY(-90px);opacity:0}}
.bulb{transition:transform .2s}
.bulb:hover{filter:drop-shadow(0 0 8px #ffeb3b)}
/* indices visuels */
.pz .h1{display:none}
.pz.hl1 .h1,.pz.hl2 .h1{display:inline}
.pz.hl1 .hy,.pz.hl2 .hy{stroke:#ff6d00;stroke-width:6}
.pz .hyx{stroke:transparent}
.pz.hl1 .hyx,.pz.hl2 .hyx{stroke:#ff6d00}
.pz.hl1 .ra,.pz.hl2 .ra{stroke:#e53935;stroke-width:4}
.pz.hl1 .tf,.pz.hl2 .tf{fill:rgba(255,193,7,.38)}
/* flèches et mini-carte */
.arrow{font:inherit;position:absolute;width:2.8em;height:2.8em;border-radius:50%;border:0;background:rgba(255,255,255,.88);color:#24364a;cursor:pointer;box-shadow:0 .15em .5em rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:2;padding:0}
.arrow:hover{background:#fff8d6}
.arrow svg{width:1.7em;height:1.7em}
.arrow[hidden]{display:none}
#aL{left:.5em;top:50%;transform:translateY(-50%)}#aR{right:.5em;top:50%;transform:translateY(-50%)}
#aU{top:.5em;left:50%;transform:translateX(-50%)}#aD{bottom:.5em;left:50%;transform:translateX(-50%)}
#mmap{position:absolute;right:.5em;top:.5em;width:9.5em;z-index:3;background:rgba(20,30,42,.78);border-radius:.6em;padding:.3em}
#mmap svg{width:100%;height:auto;display:block}
#mmap [data-room]{cursor:pointer}
#toast{position:absolute;left:50%;bottom:.8em;transform:translateX(-50%);width:max-content;max-width:min(36em,90%);background:#fffdf5;border-radius:.7em;padding:.55em .9em;box-shadow:0 .2em .8em rgba(0,0,0,.45);display:none;z-index:4;line-height:1.4;cursor:pointer}
#toast.on{display:block}
#inv{display:flex;align-items:center;gap:.45em;padding:.3em .6em;background:#24364a;color:#fff;flex:0 0 auto;min-height:3.3em}
#slots{display:flex;gap:.45em}
.slot{font:inherit;width:2.7em;height:2.7em;border-radius:.55em;background:#33495f;border:2px solid #4b6580;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;touch-action:none}
.slot.sel{border-color:#ffca28;background:#4b6580}
.slot svg{width:2.1em;height:2.1em}
.slot.empty{cursor:default;opacity:.4}
#ver{margin-left:auto;opacity:.55;font-size:.8em;white-space:nowrap}
#held{position:fixed;width:3.2em;height:3.2em;pointer-events:none;z-index:40;transform:translate(-50%,-50%);display:none;filter:drop-shadow(0 .2em .3em rgba(0,0,0,.5))}
#held svg{width:100%;height:100%}
#lens{position:fixed;width:15em;height:15em;border-radius:50%;overflow:hidden;pointer-events:none;z-index:35;display:none;border:5px solid #263238;box-shadow:0 .3em 1.2em rgba(0,0,0,.6),inset 0 0 0 2px rgba(255,255,255,.6);background:#1b2430;transform:translate(-50%,-50%)}
#lens svg{width:100%;height:100%;display:block}
#ov{position:fixed;inset:0;background:rgba(12,18,28,.62);display:flex;align-items:center;justify-content:center;z-index:20;padding:1vh 1vw}
#ov[hidden]{display:none}
.panel{background:#fffdf8;border-radius:.9em;max-width:96vw;max-height:96vh;overflow:auto;padding:1em 1.4em;box-shadow:0 .4em 2em rgba(0,0,0,.5);line-height:1.45;text-align:center}
.panel.wide{text-align:left;width:min(60em,96vw)}
.panel h1{font-family:"Century Gothic","URW Gothic","URW Gothic L","TeX Gyre Adventor",Futura,Arial,sans-serif;margin:.2em 0 .5em;font-size:2em}
.bigbtn{font:inherit;border:0;border-radius:50%;width:5em;height:5em;background:#2e7d32;color:#fff;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;margin:.3em;box-shadow:0 .2em .6em rgba(0,0,0,.3)}
.bigbtn:hover{background:#3b9441}
.bigbtn.gray{background:#607d8b}
.bigbtn svg{width:2.6em;height:2.6em}
.stats{display:flex;justify-content:center;gap:1.4em;font-size:1.6em;font-weight:bold;margin:.4em 0;font-variant-numeric:tabular-nums}
.stats span{display:inline-flex;align-items:center;gap:.3em}
.stats svg{width:1.1em;height:1.1em}
table.lst{border-collapse:collapse;width:100%;margin:.4em 0}
table.lst td{padding:.25em .45em;border-bottom:1px solid #eadfca;vertical-align:top}
.muted{color:#666;font-size:.9em}
input.num{font:inherit;width:5em;padding:.2em .4em;border:2px solid #90a4ae;border-radius:.45em}
/* calculatrice */
#calc{position:fixed;right:1em;bottom:4em;z-index:30;width:15em;background:#2b3a4a;border-radius:.8em;box-shadow:0 .4em 1.6em rgba(0,0,0,.55);padding:.45em .55em .6em;color:#fff;user-select:none}
#calc[hidden]{display:none}
#chead{display:flex;align-items:center;gap:.4em;cursor:move;padding:0 0 .35em;touch-action:none}
#chead .grip{flex:1;height:.5em;border-radius:.3em;background:repeating-linear-gradient(90deg,#4b6580 0 .3em,transparent .3em .5em)}
#cclose{font:inherit;background:#607d8b;color:#fff;border:0;border-radius:.4em;width:1.8em;height:1.6em;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
#cclose svg{width:1em;height:1em}
#cdisp{background:#d7e8c8;color:#1b2b10;border-radius:.4em;padding:.25em .45em;font-family:"Courier New","Liberation Mono",monospace;min-height:3.1em;display:flex;flex-direction:column;justify-content:space-between}
#cexp{font-size:.85em;min-height:1.2em;word-break:break-all;text-align:left}
#cres{font-size:1.35em;font-weight:bold;text-align:right;min-height:1.2em}
#cgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:.3em;margin-top:.45em}
#cgrid button{font:inherit;font-weight:bold;height:2.1em;border:0;border-radius:.4em;background:#eceff1;cursor:pointer;color:#1d1d1d;padding:0}
#cgrid button:hover{background:#fff}
#cgrid button.op{background:#ffcc80}#cgrid button.fn{background:#b3e5fc}#cgrid button.eq{background:#66bb6a;color:#fff;height:auto}#cgrid button.cl{background:#ef9a9a}
/* enseignant */
#tbar{display:none;gap:.4em;align-items:center}
body.prof #tbar{display:inline-flex}
#tstep{background:#6a1b9a}#tauto{background:#6a1b9a}#tans{background:#6a1b9a}
#tauto.on{background:#f9a825;color:#3e2700}
@media (max-width:900px){#hud .title{display:none}#mmap{width:7.5em}}
@media (max-width:520px){.chip{padding:.2em .4em}.btn{padding:.35em .45em}.slot{width:2.3em;height:2.3em}#mmap{width:6em}}
</style>
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="title">L’atelier de Pythagore</div>
    <span id="tbar"><button class="btn" id="tstep" title="Jouer l’étape suivante">Étape suivante</button><button class="btn" id="tauto" title="Jouer tout seul">Lecture</button><button class="btn" id="tans" title="Réponses de cette version">Réponses</button></span>
    <div class="chip" title="Temps"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M12 6.5V12l3.5 2.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg><span id="tm">00:00</span></div>
    <div class="chip" title="Points">★ <span id="pts">0</span></div>
    <button class="btn" id="bLoupe" title="Loupe"><svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="6.5" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M15 15l6 6" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/><path d="M7 10h6M10 7v6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
    <button class="btn gray" id="bCalc" title="Calculatrice"></button>
    <button class="btn" id="bFull" title="Plein écran"><svg viewBox="0 0 24 24" id="icFull"><path d="M3.5 9V3.5H9M15 3.5h5.5V9M20.5 15v5.5H15M9 20.5H3.5V15" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button class="btn" id="bMenu" title="Menu"><svg viewBox="0 0 24 24"><path d="M4 6.5h16M4 12h16M4 17.5h16" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg></button>
  </header>
  <main id="stage">
    <svg id="scene" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif"></svg>
    <button class="arrow" id="aL" title="←"><svg viewBox="0 0 24 24"><path d="M15.5 4.5 8 12l7.5 7.5" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button class="arrow" id="aR" title="→"><svg viewBox="0 0 24 24"><path d="M8.5 4.5 16 12l-7.5 7.5" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button class="arrow" id="aU" title="↑"><svg viewBox="0 0 24 24"><path d="M4.5 15.5 12 8l7.5 7.5" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button class="arrow" id="aD" title="↓"><svg viewBox="0 0 24 24"><path d="M4.5 8.5 12 16l7.5-7.5" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <div id="mmap"></div>
    <div id="toast"></div>
  </main>
  <footer id="inv"><div id="slots"></div><span id="ver"></span></footer>
</div>
<div id="held"></div>
<div id="lens"><svg id="lensSvg" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif"></svg></div>
<div id="ov" hidden><div class="panel" id="pn"></div></div>
<div id="calc" hidden>
  <div id="chead"><div class="grip"></div><button id="cclose" title="Fermer"><svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg></button></div>
  <div id="cdisp"><div id="cexp"></div><div id="cres">0</div></div>
  <div id="cgrid"></div>
</div>
<script>
'use strict';
(function(){
/* =====================================================================
   Escape game « L’atelier de Pythagore » — 11CT, théorème de Pythagore.
   Sans texte dans les énigmes : les mesures sont écrites sur les objets,
   les réponses se règlent sur des cadenas à molettes (arrondi au dixième).
   Chaque élève a sa version (numéro tiré au hasard).
   Version enseignant (PROF = true) : lecture automatique et réponses.
   ===================================================================== */
const PROF=false;
const $=s=>document.querySelector(s);
const SAVE_KEY=PROF?'escape-pythagore-11ct-prof-v2':'escape-pythagore-11ct-v2';
const MAIN=['E1','E2','E3','E4','E5','E6'],BONUS=['B1','B2','B3','B4','B5'];
const CALC_COST=50,ESC_PTS=100;

/* ---------- hasard reproductible, nombres ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^(a>>>15),1|a);t=t+Math.imul(t^(t>>>7),61|t)^t;return((t^(t>>>14))>>>0)/4294967296;};}
function R(seed,k){const r=mulberry32(seed*7919+k*104729+13);for(let i=0;i<5;i++)r();return r;}
const ri=(r,a,b)=>a+Math.floor(r()*(b-a+1));
const pick=(r,a)=>a[Math.floor(r()*a.length)];
function shuffle(r,a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}
const r4=x=>Math.round(x*1e4)/1e4;
const round1=x=>Math.round(x*10+1e-9)/10;
const round2=x=>Math.round(x*100+1e-9)/100;
const sq=x=>r4(x*x);
function okR(x){const f=x*10-Math.floor(x*10);return f<0.38||f>0.62;}
function fmt(x,dec){if(dec===undefined)dec=2;const p=Math.pow(10,dec);let s=(Math.round(x*p)/p).toFixed(dec);
  if(s.indexOf('.')>=0)s=s.replace(/0+$/,'').replace(/\.$/,'');let parts=s.split('.');let i=parts[0];const d=parts[1];
  if(i.length>=5)i=i.replace(/\B(?=(\d{3})+(?!\d))/g,' ');return i+(d?','+d:'');}
const NB=' ';
const U=(x,u)=>fmt(x)+NB+u;
const isInt=x=>Math.abs(x-Math.round(x))<1e-9;
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function mmss(t){const m=Math.floor(t/60),s=t%60;return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');}
function digitsOf(x){const s=round1(x).toFixed(1);const p=s.split('.');return {d:(p[0]+p[1]).split('').map(Number),nInt:p[0].length};}
const POOL='ABCEFGHJKLMNRSTUV'.split('');   /* ni D ni P : jamais « PD » */
const letters=(r,n)=>shuffle(r,POOL).slice(0,n);
const sg=(a,b)=>[a,b].sort().join('');

/* ---------- géométrie ---------- */
const add=(a,b)=>[a[0]+b[0],a[1]+b[1]],sub=(a,b)=>[a[0]-b[0],a[1]-b[1]],mul=(a,k)=>[a[0]*k,a[1]*k],dot=(a,b)=>a[0]*b[0]+a[1]*b[1];
const nrm=a=>{const l=Math.hypot(a[0],a[1])||1;return[a[0]/l,a[1]/l];};
const lerp=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];
const cen=ps=>[ps.reduce((s,p)=>s+p[0],0)/ps.length,ps.reduce((s,p)=>s+p[1],0)/ps.length];
const f2=x=>(Math.round(x*10)/10).toString();
const pts=ps=>ps.map(p=>f2(p[0])+','+f2(p[1])).join(' ');
function place(P,o){let q=P.map(p=>[o.mir?-p[0]:p[0],-p[1]]);const c=Math.cos(o.rot||0),s=Math.sin(o.rot||0);
  q=q.map(p=>[p[0]*c-p[1]*s,p[0]*s+p[1]*c]);const xs=q.map(p=>p[0]),ys=q.map(p=>p[1]);
  const mnx=Math.min.apply(null,xs),mxx=Math.max.apply(null,xs),mny=Math.min.apply(null,ys),mxy=Math.max.apply(null,ys);
  const k=o.k||Math.min(o.W/((mxx-mnx)||1),o.H/((mxy-mny)||1));const ox=(o.x0||0)+(o.W-(mxx-mnx)*k)/2,oy=(o.y0||0)+(o.H-(mxy-mny)*k)/2;
  return {pts:q.map(p=>[(p[0]-mnx)*k+ox,(p[1]-mny)*k+oy]),k:k};}
const CW={'0':.556,'1':.556,'2':.556,'3':.556,'4':.556,'5':.556,'6':.556,'7':.556,'8':.556,'9':.556,',':.278,' ':.278,' ':.278,'c':.5,'m':.833,'?':.62,'°':.4,'²':.333,'=':.584,'+':.584,'−':.584,'∙':.3,':':.278};
function tw(t,fs){let w=0;for(const ch of t)w+=(CW[ch]!==undefined?CW[ch]:.68);return w*fs;}

/* ---------- dessin des énigmes ---------- */
class Fig{
  constructor(o){o=o||{};this.fs=o.fs||22;this.ink=o.ink||'#1d1d1d';this.halo=o.halo||null;this.out=[];this.bx=[];this.segs=[];this.P=[];}
  add(s){this.out.push(s);}
  cl(o){return o&&o.cls?` class="${o.cls}"`:'';}
  line(a,b,o){o=o||{};this.P.push(a,b);if(!o.ghost)this.segs.push([a,b]);
    this.add(`<line${this.cl(o)} x1="${f2(a[0])}" y1="${f2(a[1])}" x2="${f2(b[0])}" y2="${f2(b[1])}" stroke="${o.c||this.ink}" stroke-width="${o.w||2.5}"${o.dash?` stroke-dasharray="${o.dash}"`:''} stroke-linecap="round"/>`);}
  poly(ps,o){o=o||{};ps.forEach(p=>this.P.push(p));if(!o.ghost)for(let i=0;i<ps.length;i++)this.segs.push([ps[i],ps[(i+1)%ps.length]]);
    this.add(`<polygon${this.cl(o)} points="${pts(ps)}" fill="${o.fill||'none'}" stroke="${o.c||this.ink}" stroke-width="${o.w===undefined?2.5:o.w}" stroke-linejoin="round"/>`);}
  text(x,y,t,o){o=o||{};const fs=o.fs||this.fs;const w=tw(t,fs),h=fs;const halo=o.halo!==undefined?o.halo:this.halo;
    if(!o.nobox)this.bx.push({x0:x-w/2,y0:y-h/2,x1:x+w/2,y1:y+h/2,t:t});
    this.add(`<text${this.cl(o)} x="${f2(x)}" y="${f2(y)}" dy="0.35em" text-anchor="middle" font-size="${fs}"${(o.bold||t==='?'||t.indexOf('?')>=0)?' font-weight="bold"':''} fill="${o.c||this.ink}"${halo?` stroke="${halo}" stroke-width="${(fs*.25).toFixed(1)}" paint-order="stroke" stroke-linejoin="round"`:''}>${esc(t)}</text>`);}
  segLab(a,b,t,ref,o){o=o||{};const fs=o.fs||this.fs;const pos=o.at!==undefined?lerp(a,b,o.at):lerp(a,b,.5);
    let n=nrm([-(b[1]-a[1]),b[0]-a[0]]);if(dot(n,sub(ref,pos))>0)n=[-n[0],-n[1]];if(o.inside)n=[-n[0],-n[1]];
    const w=tw(t,fs),off=(o.gap||8)+Math.abs(n[0])*w/2+Math.abs(n[1])*fs/2;this.text(pos[0]+n[0]*off,pos[1]+n[1]*off,t,o);}
  vName(v,ref,t,o){const u=nrm(sub(v,ref));const fs=this.fs,w=tw(t,fs);const off=7+Math.abs(u[0])*w/2+Math.abs(u[1])*fs/2;this.text(v[0]+u[0]*off,v[1]+u[1]*off,t,o);}
  nameAt(v,dir,t,o){const u=nrm(dir);const fs=this.fs,w=tw(t,fs);const off=7+Math.abs(u[0])*w/2+Math.abs(u[1])*fs/2;this.text(v[0]+u[0]*off,v[1]+u[1]*off,t,o);}
  right(v,a,b,q,o){o=o||{};q=q||15;const e1=nrm(sub(a,v)),e2=nrm(sub(b,v));const p1=add(v,mul(e1,q)),p3=add(v,mul(e2,q)),p2=add(p1,mul(e2,q));
    if(!o.ghost)this.segs.push([p1,p2],[p2,p3]);this.add(`<polyline${this.cl(o)} points="${pts([p1,p2,p3])}" fill="none" stroke="${o.c||this.ink}" stroke-width="${o.w||1.8}"/>`);}

let cx='',cres=null,cjust=false;
const CK=[['C','cl'],['⌫','cl'],['(',''],[')',''],['x²','fn'],['√','fn'],[':','op'],['∙','op'],['7',''],['8',''],['9',''],['−','op'],['4',''],['5',''],['6',''],['+','op'],['1',''],['2',''],['3',''],['=','eq'],['0',''],[',',''],['Ans','fn']];
function calcBuild(){$('#cgrid').innerHTML=CK.map(k=>`<button class="${k[1]}" data-c="${k[0]}"${k[0]==='='?' style="grid-row:span 2"':''}>${k[0]}</button>`).join('');}
function calcEval(src){let i=0;const s=src.replace(/\s/g,'');
  function num(){let j=i;while(i<s.length&&/[0-9,]/.test(s[i]))i++;if(j===i)throw 0;const t=s.slice(j,i).replace(',','.');if((t.match(/\./g)||[]).length>1)throw 0;return parseFloat(t);}
  function atom(){if(s[i]==='('){i++;const v=expr();if(s[i]===')')i++;return v;}if(s[i]==='√'){i++;const v=post(atom());if(v<0)throw 0;return Math.sqrt(v);}
    if(s[i]==='−'||s[i]==='-'){i++;return -post(atom());}if(s.slice(i,i+3)==='Ans'){i+=3;if(cres===null)throw 0;return cres;}return num();}
  function post(v){while(s[i]==='²'){v=v*v;i++;}return v;}
  function term(){let v=post(atom());while(s[i]==='∙'||s[i]===':'){const o=s[i++];const w=post(atom());if(o===':'){if(w===0)throw 0;v=v/w;}else v=v*w;}return v;}
  function expr(){let v=term();while(s[i]==='+'||s[i]==='−'){const o=s[i++];const w=term();v=o==='+'?v+w:v-w;}return v;}
  const v=expr();if(i<s.length)throw 0;return v;}
function calcShow(v){if(!isFinite(v))return 'E';let t=Math.abs(v)>=1e10||(Math.abs(v)<1e-6&&v!==0)?v.toExponential(6):String(+v.toPrecision(10));return t.replace('.',',').replace('-','−');}
function calcKey(k){const ex=$('#cexp'),rs=$('#cres');
  if(k==='C'){cx='';rs.textContent='0';cjust=false;}else if(k==='⌫'){cx=cx.slice(-3)==='Ans'?cx.slice(0,-3):cx.slice(0,-1);cjust=false;}
  else if(k==='='){if(!cx)return;let src=cx;const op=(src.match(/\(/g)||[]).length-(src.match(/\)/g)||[]).length;for(let j=0;j<op;j++)src+=')';
    try{const v=calcEval(src);cres=v;rs.textContent=calcShow(v);cx=src;cjust=true;}catch(e){rs.textContent='E';}}
  else{let t=k==='x²'?'²':k==='√'?'√(':k;if(cjust){cx=(/^[+−∙:²]/.test(t)&&cres!==null)?'Ans':'';cjust=false;}cx+=t;}ex.textContent=cx;}

function restart(){try{localStorage.removeItem(SAVE_KEY);}catch(e){}held=null;$('#held').style.display='none';showCalc(false);S=newState(newSeed());G=genAll(S.seed);save();closeModal();running=true;render();}

/* ---------- enseignant : réponses ---------- */
function answersHTML(seed){const g=genAll(seed);const L={E1:'Bureau : plan → tiroir',E2:'Bibliothèque : boîte dans l’armoire (clé du tiroir)',E3:'Hall : échelle → coffre de la mezzanine',E4:'Mezzanine : affiche (lampe de la boîte)',E5:'Bibliothèque : coffre-fort',E6:'Bureau : maquette',
  B1:'Jardin : cerf-volant',B2:'Jardin : pignon de la cabane',B3:'Potager : raccourci',B4:'Potager : bordure du losange',B5:'Potager : plan'};
  const rows=MAIN.concat(BONUS).map(id=>{const e=g.en[id];return `<tr><td>${L[id]}</td><td><b>${esc(e.dig.slice(0,e.nInt).join('')+','+e.dig.slice(e.nInt).join('')+' '+e.unit)}</b></td><td class="muted">${esc(e.ans)}</td></tr>`;}).join('');
  const SH={E1:'plan',E2:'boîte',E3:'échelle',E4:'affiche',E5:'coffre-fort',E6:'maquette'};
  const bd='Tableau, de gauche à droite : '+g.board.map(b=>`${SH[b.id]} (${['1er','2e','3e','4e'][b.pos]} chiffre) → ${b.digit}`).join(' ; ');
  return `<div style="text-align:left"><h2 style="margin:.2em 0">Réponses — version n° ${seed}</h2><p>Code de la porte : <b style="font-size:1.3em">${g.code}</b></p><p class="muted">${esc(bd)}</p><table class="lst">${rows}</table>
  <form id="tF"><label>Autre version : <input class="num" id="tI" value="${seed}"></label> <button class="btn" type="submit">Afficher</button> <button class="btn gray" type="button" data-act="close">Fermer</button></form>
  <p class="muted">Calculatrice cachée derrière l’horloge de la bibliothèque (ou −50 points). Indices : l’ampoule près de chaque énigme (couleurs, puis formule).</p></div>`;}

/* ---------- enseignant : lecture automatique ---------- */
const sleep=ms=>new Promise(res=>setTimeout(res,ms));
let autoOn=false,busy=false;
async function pulse(sel){await sleep(60);fx(sel,'pulse');await sleep(700);}
async function goA(r){if(S.room!==r){go(r);await sleep(500);}}
async function setLockA(id){const e=G.en[id];PROFSHOW[id]=true;render();await sleep(900);
  const w=wheels(id);for(let i=0;i<e.dig.length;i++){while(w[i]!==e.dig[i]){w[i]=(w[i]+1)%10;render();await sleep(70);}await sleep(150);}save();checkLock(id);await sleep(900);}
async function useA(it,target){holdItem(it);await sleep(500);useOn(target);await sleep(800);}
function plan(){const st=[];const T=(f)=>st.push(f);
  if(!S.solved.E1)T(async()=>{await goA('bureau');await setLockA('E1');});
  else if(!S.taken.key)T(async()=>{await goA('bureau');take('key');await sleep(600);});
  else if(!S.cabinet)T(async()=>{await goA('biblio');await useA('key','key');});
  else if(!S.solved.E2)T(async()=>{await goA('biblio');await setLockA('E2');});
  else if(!S.taken.lamp)T(async()=>{await goA('biblio');take('lamp');await sleep(600);});
  else if(!S.clock)T(async()=>{await goA('biblio');S.clock=true;save();render();await sleep(800);take('calc');await sleep(700);});
  else if(!S.revealed)T(async()=>{await goA('hall');await goA('mezz');await useA('lamp','lamp');});
  else if(!S.solved.E4)T(async()=>{await goA('mezz');await setLockA('E4');});
  else if(!S.solved.E3)T(async()=>{await goA('hall');PROFSHOW.E3=true;render();await sleep(1600);await goA('mezz');await setLockA('E3');});
  else if(!S.solved.E5)T(async()=>{await goA('hall');await goA('biblio');await setLockA('E5');});
  else if(!S.solved.E6)T(async()=>{await goA('hall');await goA('bureau');await setLockA('E6');});
  else if(!S.escaped)T(async()=>{await goA('hall');for(let k=0;k<6;k++){const b=G.board[k];while(S.board[k]!==b.digit){S.board[k]=(S.board[k]+1)%10;render();await sleep(70);}await sleep(200);}save();checkBoard();await sleep(1800);});
  else if(modal&&modal.kind==='victory')T(async()=>{closeModal();go('jardin');await sleep(500);});
  else{const nx=BONUS.find(b=>!S.solved[b]);if(nx)T(async()=>{closeModal();await goA(G.en[nx].room);await setLockA(nx);});}
  return st;}
async function step(){if(busy)return false;const st=plan();if(!st.length)return false;busy=true;try{await st[0]();}finally{busy=false;}return true;}
async function autoPlay(){autoOn=!autoOn;$('#tauto').classList.toggle('on',autoOn);while(autoOn){const ok=await step();if(!ok){autoOn=false;$('#tauto').classList.remove('on');break;}await sleep(500);}}

/* ---------- événements ---------- */
function bind(){
  const sc=$('#scene');sc.addEventListener('click',onScene);sc.addEventListener('wheel',onWheel,{passive:false});
  $('#aL').onclick=()=>go(neigh(S.room,'left'));$('#aR').onclick=()=>go(neigh(S.room,'right'));$('#aU').onclick=()=>go(neigh(S.room,'up'));$('#aD').onclick=()=>go(neigh(S.room,'down'));
  $('#mmap').addEventListener('click',e=>{const r=e.target.closest('[data-room]');if(r&&running)go(r.getAttribute('data-room'));});
  $('#bLoupe').onclick=toggleLoupe;$('#bCalc').onclick=onCalcBtn;$('#bFull').onclick=toggleFS;$('#bMenu').onclick=()=>{if(running)showMenu();};
  $('#toast').onclick=()=>$('#toast').classList.remove('on');
  $('#slots').addEventListener('click',e=>{const b=e.target.closest('[data-it]');if(b&&running)holdItem(b.getAttribute('data-it'));});
  document.addEventListener('pointermove',e=>{if(held){const h=$('#held');h.style.left=e.clientX+'px';h.style.top=e.clientY+'px';}if(loupeOn)lensMove(e.clientX,e.clientY);});
  $('#pn').addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.getAttribute('data-act');
    if(a==='start'){S=newState(newSeed());G=genAll(S.seed);save();closeModal();running=true;render();}
    else if(a==='resume'){closeModal();running=true;render();}else if(a==='restart')restart();else if(a==='close')closeModal();else if(a==='garden'){closeModal();go('jardin');}});
  $('#pn').addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='tF'){const v=parseInt($('#tI').value,10);if(v>=1000&&v<=9999)openModal(answersHTML(v),{wide:true});}});
  $('#ov').addEventListener('click',e=>{if(e.target.id==='ov'&&modal&&modal.closable)closeModal();});
  $('#cgrid').addEventListener('click',e=>{const b=e.target.closest('[data-c]');if(b)calcKey(b.getAttribute('data-c'));});$('#cclose').onclick=()=>showCalc(false);
  (function(){const c=$('#calc'),h=$('#chead');let d=null;h.addEventListener('pointerdown',e=>{if(e.target.closest('#cclose'))return;const r=c.getBoundingClientRect();d=[e.clientX-r.left,e.clientY-r.top];h.setPointerCapture(e.pointerId);});
    h.addEventListener('pointermove',e=>{if(!d)return;const x=Math.max(0,Math.min(innerWidth-c.offsetWidth,e.clientX-d[0])),y=Math.max(0,Math.min(innerHeight-40,e.clientY-d[1]));c.style.left=x+'px';c.style.top=y+'px';c.style.right='auto';c.style.bottom='auto';});
    h.addEventListener('pointerup',()=>{d=null;});})();
  document.addEventListener('keydown',e=>{if(e.target&&e.target.tagName==='INPUT')return;
    if(e.key==='Escape'){if(held){dropHeld(false);return;}if(modal&&modal.closable){closeModal();return;}if(!$('#calc').hidden)showCalc(false);return;}
    if(!running||modal)return;const m={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down'}[e.key];if(m){e.preventDefault();const t=neigh(S.room,m);if(t)go(t);else shakeSel('#mmap');}});
  document.addEventListener('fullscreenchange',fsIcon);
  if(PROF){document.body.classList.add('prof');$('#tstep').onclick=()=>{if(running&&!autoOn)step();};$('#tauto').onclick=()=>{if(running)autoPlay();};$('#tans').onclick=()=>{if(S)openModal(answersHTML(S.seed),{wide:true});};}
  setInterval(()=>{if(running&&S&&!document.hidden&&!S.bonusEnd){S.t++;hud();if(S.t%5===0)save();}},1000);
  window.addEventListener('beforeunload',()=>{if(S)save();});}
function toggleFS(){const d=document,el=d.documentElement;if(!d.fullscreenElement){const rq=el.requestFullscreen||el.webkitRequestFullscreen;if(rq){const p=rq.call(el);if(p&&p.catch)p.catch(()=>{});}}else{const ex=d.exitFullscreen||d.webkitExitFullscreen;if(ex)ex.call(d);}}
function fsIcon(){$('#icFull').innerHTML=document.fullscreenElement?'<path d="M9 3.5V9H3.5M20.5 9H15V3.5M15 20.5V15h5.5M3.5 15H9v5.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>':'<path d="M3.5 9V3.5H9M15 3.5h5.5V9M20.5 15v5.5H15M9 20.5H3.5V15" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>';}

/* ---------- départ ---------- */
if(PROF)document.title+=' (prof)';
calcBuild();bind();
const old=load();
if(old){S=old;G=genAll(S.seed);render();showResume();}
else{S=newState(1000);G=genAll(1000);render();showStart();}
if(PROF||/[?&]test\b/.test(location.search))window.EG={genAll:genAll,digitsOf:digitsOf,get S(){return S;},get G(){return G;},turn:turn,go:go,take:take,holdItem:holdItem,useOn:useOn,step:step,render:render,okR:okR};
})();
</script>
</body>
</html>
