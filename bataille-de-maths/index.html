<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bataille de maths</title>
<style>
:root{--ink:#1d2a3a;--muted:#6b7480;--panel:#fffdf8;--line:#d9d6cc;--red:#c0392b;--gold:#d79a00;--ok:#2e7d32;--accent:#1f5fa8;--pc:#1f5fa8;
  --tfont:"Century Gothic","URW Gothic","URW Gothic L","Avant Garde",Futura,"Trebuchet MS",sans-serif;--font:Arial,"Liberation Sans",Helvetica,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#20262e;color:var(--ink);font-family:var(--font);user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
#app{position:fixed;inset:0;display:grid;grid-template-rows:auto minmax(0,46fr) minmax(0,54fr);grid-template-columns:minmax(0,18fr) minmax(0,82fr);font-size:var(--fs,15px)}
/* barre du haut */
#top{grid-column:1/3;display:flex;align-items:center;gap:1em;padding:.3em .7em;background:#2b3440;color:#f4efe4;min-height:2.4em}
#top .ttl{font-family:var(--tfont);font-weight:700;white-space:nowrap}
#top .ttl small{font-weight:400;opacity:.75;margin-left:.4em}
#top .mid{flex:1;display:flex;align-items:center;justify-content:center;gap:1.3em;white-space:nowrap;min-width:0}
#top .grp{display:flex;align-items:center;gap:.35em}
#top .lab{opacity:.8;font-size:.85em}
#top .bar{width:7em;height:.7em;border-radius:.35em;background:#57606b;overflow:hidden;display:block}
#top .bar i{display:block;height:100%;transition:width .25s}
#hpb i{background:linear-gradient(#5fd17a,#2e9e4f)}
#hpb.low i{background:linear-gradient(#ffb36b,#e06a1a)}
#ehpb i{background:linear-gradient(#ff8a7a,#d63a2a)}
#xpb{width:9em}
#xpb i{background:linear-gradient(#ffe27a,#e0a800)}
#eraN{font-weight:700;font-family:var(--tfont)}
#eEraN{opacity:.8;font-size:.85em}
#tm{opacity:.7;font-size:.85em;font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:.3em;background:rgba(255,255,255,.12);padding:.1em .6em;border-radius:1em;font-weight:700;font-size:1.1em}
.pill.bump{animation:bump .5s}
@keyframes bump{30%{transform:scale(1.25);background:#f1c40f;color:#3b2f00}}
#stk{font-size:.85em;color:#ffd166}
.coin{width:1em;height:1em;flex:none;vertical-align:-.15em}
#top .btns{display:flex;gap:.3em}
.ib{display:inline-flex;align-items:center;justify-content:center;width:2em;height:2em;border-radius:.45em;border:0;background:#3b4654;color:#f4efe4;padding:0}
.ib svg{width:1.2em;height:1.2em}
.ib:hover{background:#4a5768}
.ib.on{background:#f4efe4;color:#2b3440}
/* champ de bataille en haut, actions et questions en bas */
#stage{grid-row:2;grid-column:1/3;position:relative;overflow:hidden;background:#20262e;border-bottom:3px solid #2b3440}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#banner{position:absolute;left:50%;top:22%;transform:translateX(-50%);font-family:var(--tfont);font-weight:700;font-size:1.7em;color:#fff;background:rgba(25,32,40,.78);padding:.15em .9em;border-radius:1em;pointer-events:none;opacity:0;transition:opacity .4s;white-space:nowrap;text-align:center}
#banner.show{opacity:1}
#banner small{display:block;font-size:.5em;font-weight:400}
#acts{grid-row:3;grid-column:1;background:#f4efe4;border-right:3px solid #2b3440;padding:.6em;display:flex;flex-direction:column;gap:.5em;min-height:0;overflow:hidden}
#qpane{grid-row:3;grid-column:2;background:var(--panel);padding:.6em 1em;display:flex;flex-direction:column;justify-content:center;gap:.5em;min-height:0;overflow:hidden}
/* actions : attaque spéciale, sorts, réparer */
.act{position:relative;display:flex;align-items:center;gap:.45em;text-align:left;border:2px solid var(--line);background:#fff;border-radius:.6em;padding:.35em .5em;width:100%;overflow:hidden;line-height:1.15}
.act:hover{border-color:var(--pc)}
.act .ic{width:1.9em;height:1.9em;flex:none}
.act .nm{font-weight:700;display:block}
.act .c{display:inline-flex;align-items:center;gap:.15em;font-weight:700;color:#7a5c00;white-space:nowrap;font-size:.9em}
.act .dsc{font-size:.78em;color:var(--muted)}
.act.no{opacity:.55;cursor:default}
.act.no:hover{border-color:var(--line)}
.act .cdv{position:absolute;inset:0;background:rgba(43,52,64,.55);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1.2em}
.act.sp{flex:1 1 auto;min-height:3.5em;flex-direction:column;justify-content:center;text-align:center;border-color:#b9a36a;background:#fffaf0}
.act.sp .fill{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(#ffe8a3,#f5c542);transition:height .3s;z-index:0}
.act.sp > *:not(.fill){position:relative;z-index:1}
.act.sp .nm{font-family:var(--tfont);font-size:1.05em}
.act.sp.ready{border-color:#e0a800;animation:ready 1s ease-in-out infinite}
@keyframes ready{50%{box-shadow:0 0 0 .25em rgba(241,196,15,.55)}}
.act.sp.ready .dsc{color:#5c4500;font-weight:700}
/* questions */
.qrow{flex:1 1 auto;min-height:0;display:flex;align-items:stretch;gap:1.2em}
.qL{flex:1 1 42%;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.4em;text-align:center;overflow:hidden}
.qR{flex:1 1 58%;min-width:0;display:flex;flex-direction:column;align-items:stretch;justify-content:center;gap:.5em;overflow:hidden}
.qrow.lines .qL{flex-basis:30%}.qrow.lines .qR{flex-basis:70%;align-items:center}
.zp{color:var(--muted);line-height:1.2}
.zx{line-height:1.25;white-space:nowrap;display:flex;align-items:center;justify-content:center;max-width:100%;margin-top:.1em}
.zx .op{margin:0 .25em}
.za{display:grid;grid-template-columns:1fr 1fr;gap:.5em;width:100%}
.ch{min-width:0;display:flex;align-items:center;justify-content:center;gap:.4em;padding:.3em;border-radius:.5em;border:2px solid var(--line);background:#fff;font-size:1.5em;min-height:2.5em;line-height:1.1}
.ch:hover{border-color:var(--pc);background:#eef4fb}
.ch.tx{font-size:1em}
.ch .frac{font-size:.85em}
.again{font-size:.8em;color:#7a3b00;text-align:center}
.gq{align-self:center;display:inline-flex;align-items:center;gap:.35em;background:#fff2c2;border:2px solid #f1c40f;border-radius:1em;padding:.1em .8em;color:#5c4500;font-size:.95em}
.gq b{font-size:1.25em;color:#7a5c00}
.gq .coin{width:1.3em;height:1.3em}
s.mine{text-decoration-thickness:.08em;color:var(--red)}
.ms{color:#7a3b00}
.qbtns{display:flex;gap:.5em;align-items:center;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:.35em;border:2px solid var(--pc);background:#fff;border-radius:.5em;padding:.3em .8em;font-weight:700}
.btn.pri{background:var(--pc);color:#fff}
.btn.lite{border-color:#b9b2a2;color:#5a5348;font-weight:400;font-size:.9em}
.fb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.35em;text-align:center;padding:.4em;border-radius:.6em}
.fb .big{font-size:1.9em;font-weight:700;font-family:var(--tfont)}
.fb.okk{background:#eaf6ea}.fb.okk .big{color:var(--ok)}
.fb .gain{font-size:1.35em;font-weight:700;display:flex;align-items:center;gap:.3em}
.spawn{display:flex;align-items:center;justify-content:center;gap:.8em;flex-wrap:wrap;font-size:1.2em;text-align:center}
.spawn img{height:7em;width:auto}
.wt{font-size:.85em;color:var(--muted)}
/* droite graduée à cliquer (estimer) */
.nl{position:relative;width:100%;height:4.6em;margin:.3em 0}
.nl.det{height:3.6em;margin:.5em auto;max-width:26em}
.nlz{position:absolute;left:1.2em;right:1.6em;top:0;bottom:0}
.nzone{position:absolute;top:.2em;height:2.2em;margin-left:2px;border:2px solid #b9cbe0;border-radius:.4em;background:#eef4fb;padding:0}
.nzone:hover{background:#cfe0f5;border-color:var(--pc)}
.nl.det .nzone{pointer-events:none;background:#f4f2ec;border-color:#ddd8cc}
.nl.det .nzone.good{background:#dff0df;border-color:var(--ok)}
.nzone.open{border-right-style:dashed}
.nax{position:absolute;left:0;right:-1.2em;top:1.3em;height:.16em;background:var(--ink);pointer-events:none}
.nax::after{content:"";position:absolute;right:-.1em;top:-.32em;border-left:.7em solid var(--ink);border-top:.4em solid transparent;border-bottom:.4em solid transparent}
.ntk{position:absolute;top:.75em;width:.16em;height:1.25em;margin-left:-.08em;background:var(--ink);pointer-events:none}
.nlb{position:absolute;top:2.55em;transform:translateX(-50%);font-size:1.15em;pointer-events:none;line-height:1}
.nmk{position:absolute;top:.15em;width:.9em;height:.9em;margin-left:-.45em;border-radius:50%;background:var(--red);border:2px solid #fff;box-shadow:0 0 0 1px var(--red)}
/* détail après une erreur (ou « Voir la réponse ») : sur toute la largeur */
.qdet{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;border:3px solid var(--pc);border-radius:.6em;background:#fff;overflow:hidden}
.qdet .dh{display:flex;align-items:center;gap:.5em;padding:.2em .6em;background:var(--pc);color:#fff;font-weight:700}
.qdet .dh .sp{margin-left:auto;font-weight:400;font-size:.85em}
.qdet .dbody{flex:1 1 auto;min-height:0;overflow:auto;padding:.3em .6em;display:flex;gap:1.2em;align-items:center;justify-content:center;line-height:1.35;user-select:text;-webkit-user-select:text}
.qdet .dl{flex:0 1 34%;min-width:0;text-align:center}
.qdet .dr{flex:1 1 66%;min-width:0;text-align:center;max-height:100%}
.qdet .dl .qq{font-size:1.15em}
.qdet .qbtns{padding:.35em;border-top:1px solid var(--line)}
.qdet.ko{border-color:var(--red)}
.qdet.ko .dh{background:var(--red)}
.wbar{position:relative;width:100%;max-width:40em;height:2.1em;border-radius:.5em;background:#ece8dd;overflow:hidden;display:flex;align-items:center;justify-content:center}
.wbar i{position:absolute;left:0;top:0;bottom:0;background:#cfe0f5;transition:width .25s linear}
.wbar span{position:relative;font-size:.9em}
.cdline{margin:.3em 0}
/* fractions (comme Questions pour des champions) */
.frac{display:inline-flex;flex-direction:column;align-items:stretch;text-align:center;vertical-align:middle;font-size:.78em;line-height:1.08;margin:0 .06em}
.frac .nu{padding:0 .15em .05em;border-bottom:.075em solid currentColor}
.frac .de{padding:.05em .15em 0}
.bp{font-size:1.45em;font-weight:300;line-height:1}
.ovl{text-decoration:overline;text-decoration-thickness:.07em}
.stp{border-collapse:collapse;margin:0 auto}
.stp td{padding:.06em .18em;white-space:nowrap}
.stp .sl{text-align:right}
.stp .sr{text-align:left}
.ans{color:var(--red);font-weight:700}
.fbars{display:flex;flex-direction:column;align-items:center;gap:.25em}
.cA{color:#1f5fa8;font-weight:700}.cB{color:#c25b00;font-weight:700}.cC{color:#2e7d32;font-weight:700}.cD{color:#d81b60;font-weight:700}.cM{color:#00897b;font-weight:700}
.fin{font-weight:700;white-space:nowrap}
.xp{position:relative;display:inline-block}
.xp::after{content:"";position:absolute;left:-.12em;right:-.12em;top:52%;border-top:.085em solid currentColor;transform:rotate(-32deg)}
.pdec{white-space:nowrap}
.fl{display:flex;align-items:center;gap:.15em}
.frow{display:flex;align-items:center;justify-content:center;gap:1.6em;flex-wrap:wrap}
.sg{font-weight:700}
.nw{white-space:nowrap}
/* calcul d'un élève : une ligne par étape, chaque ligne (sauf la 1re) numérotée et cliquable */
.cdv{display:inline-flex;flex-direction:column;align-items:stretch;gap:.2em;color:#1a3f8a;text-align:left}
.cdr{display:flex;align-items:center;gap:.1em;padding:.1em .45em .1em .2em;border-radius:.5em;border:2px solid transparent;background:none;width:100%}
button.cdr{font:inherit;color:inherit;border-color:#d6dfeb;background:#f7f9fc}
button.cdr:hover{background:#d9e7f7;border-color:var(--pc)}
.cdr .cdc{display:inline-flex;align-items:center;white-space:nowrap}
.cdr .eq{display:inline-block;width:1.1em;text-align:center;flex:none}
.cdn{display:inline-flex;align-items:center;justify-content:center;width:1.5em;height:1.5em;border-radius:50%;background:#6b7480;color:#fff;font:700 .55em var(--font);flex:none;margin-right:.2em}
.cdr.q0 .cdn,.cdr.q0 .eq{visibility:hidden}
.zl .cdv{row-gap:.25em}
.cdline + .cdcols{margin-top:.2em}
.cdcols{display:flex;flex-wrap:wrap;justify-content:center;gap:.4em 1.6em}
.cdr.bad .cdc{color:var(--red);text-decoration:line-through;text-decoration-thickness:.08em}
.cdr.bad .cdn{background:var(--red)}
.cdr.gry{opacity:.45}
.cdv .op{margin:0 .2em}
.note{color:var(--muted);font-size:.85em}
/* menus autour d'un créneau du mur */
#radial{position:absolute;inset:0;pointer-events:none;z-index:5}
#radial[hidden]{display:none}
.ri{position:absolute;width:var(--rs);height:var(--rs);border-radius:50%;border:3px solid #2b3440;background:radial-gradient(circle at 40% 35%,#fffdf6,#e9e2d0);pointer-events:auto;padding:0;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(0,0,0,.35);transition:transform .12s}
.ri:hover,.ri.hov{transform:scale(1.1);border-color:#f1c40f}
.ri img{width:88%;height:88%;object-fit:contain;margin-top:-10%}
.ri .ic{width:52%;height:52%;margin-top:-14%}
.ri .rc{position:absolute;bottom:-.55em;left:50%;transform:translateX(-50%);display:inline-flex;align-items:center;gap:.12em;background:#2b3440;color:#ffe9a8;border-radius:.8em;padding:.05em .45em;font-weight:700;font-size:calc(var(--rs) * .2);white-space:nowrap}
.ri.no{filter:grayscale(.85);opacity:.8}
.ri.no .rc{color:#ff9d8f}
.ri.max .rc{background:var(--ok);color:#fff}
.ri .pips{position:absolute;bottom:22%;left:50%;transform:translateX(-50%);display:flex;gap:.18em}
.ri .pips i{width:calc(var(--rs) * .09);height:calc(var(--rs) * .09);border-radius:50%;border:1px solid #7a5c00;background:#fff}
.ri .pips i.on{background:#f1c40f}
#tip{position:absolute;z-index:6;max-width:19em;background:rgba(255,253,248,.97);border:2px solid #2b3440;border-radius:.6em;padding:.4em .6em;font-size:.9em;line-height:1.3;pointer-events:none;box-shadow:0 3px 10px rgba(0,0,0,.3)}
#tip[hidden]{display:none}
#tip .tn{font-weight:700;font-family:var(--tfont)}
#tip .c{display:inline-flex;align-items:center;gap:.15em;font-weight:700;color:#7a5c00}
#tip .c.no{color:var(--red)}
#tip b.up{color:var(--ok)}
/* fenêtres */
.ov{position:fixed;inset:0;background:rgba(20,26,33,.72);display:flex;align-items:center;justify-content:center;z-index:50;padding:1em;font-size:var(--fs,15px)}
.ov[hidden]{display:none}
.card{background:var(--panel);border-radius:.8em;box-shadow:0 10px 40px rgba(0,0,0,.4);max-width:min(1250px,96vw);max-height:96vh;overflow:auto;padding:1em 1.3em;font-size:1.05em}
.card h1,.card h2{font-family:var(--tfont);margin:.1em 0 .4em}
.card h1{font-size:1.8em;text-align:center}
.rules{max-width:44em;margin:0 auto .8em;text-align:center;color:#3b4654;line-height:1.4}
.maps{display:grid;grid-template-columns:repeat(3,1fr);gap:.8em}
.mapc{border:3px solid transparent;border-radius:.6em;background:#fff;padding:.3em;display:flex;flex-direction:column;align-items:center;gap:.2em;font-weight:700}
.mapc.sel{border-color:var(--accent);box-shadow:0 0 0 3px #1f5fa855}
.mapc small{font-weight:400;font-size:.75em;color:var(--muted);min-height:1.2em;text-align:center}
.mimg{position:relative;display:block;width:100%}
.mimg canvas{display:block;width:100%;aspect-ratio:320/150;border-radius:.4em;background:#ccc}
.mapc.lockd canvas{filter:grayscale(1) brightness(.75)}
.mapc.lockd{opacity:.85}
.mimg .lock{position:absolute;left:50%;top:50%;width:26%;height:auto;transform:translate(-50%,-50%);filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}
.mimg .crown{position:absolute;right:4%;top:4%;width:18%;height:auto;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
.go{display:flex;justify-content:center;gap:.8em;margin-top:.8em}
.go .btn{font-size:1.25em;padding:.35em 1.4em}
.res{display:flex;flex-direction:column;gap:.3em;align-items:center;font-size:1.2em}
h1.win{color:#7a5c00;display:flex;align-items:center;justify-content:center;gap:.3em}
h1.win .crown{width:1.3em;height:1.3em}
.unl{background:#fff2c2;border:2px solid #f1c40f;border-radius:.6em;padding:.4em .8em;margin:.5em auto .2em;max-width:40em;text-align:center}
/* espace enseignant */
.prof h2{display:flex;align-items:center;gap:.5em}
.prof section{border-top:1px solid var(--line);padding:.5em 0}
.prof label{display:inline-flex;align-items:center;gap:.3em;margin:.15em .7em .15em 0}
.prof .qr{width:9em;height:9em;flex:none}
.prof .lk{display:flex;gap:1em;align-items:center}
.prof .url{word-break:break-all;font-family:monospace;font-size:.85em;background:#f1eee6;padding:.3em .5em;border-radius:.3em;user-select:text;-webkit-user-select:text}
.prof table{border-collapse:collapse;font-size:.9em}
.prof td,.prof th{border:1px solid var(--line);padding:.15em .5em;text-align:center}
.prof th{background:#ece8dd}
.seg{display:inline-flex;border:2px solid var(--accent);border-radius:.5em;overflow:hidden}
.seg button{border:0;background:#fff;padding:.2em .7em}
.seg button.on{background:var(--accent);color:#fff}
.toast{position:fixed;left:50%;bottom:40%;transform:translateX(-50%);background:#2b3440;color:#fff;padding:.5em 1em;border-radius:.6em;z-index:80;pointer-events:none;opacity:0;transition:opacity .3s}
.toast.show{opacity:1}
</style>
</head>
<body>
<div id="app">
<header id="top"><span class="ttl">Bataille de maths<small id="mapName"></small></span>
<div class="mid">
<span class="grp" title="Vie de ta base"><span id="hpi"></span><span class="lab">Ta base</span><span class="bar" id="hpb"><i></i></span><span id="hpt"></span></span>
<span class="grp" id="eraG"><span id="eraN"></span><span class="bar" id="xpb"><i></i></span></span>
<span class="grp" title="Vie de la base ennemie"><span class="lab">Base ennemie</span><span class="bar" id="ehpb"><i></i></span><span id="ehpt"></span><span id="eEraN"></span></span>
<span class="pill" id="gold" title="Or : pour construire et améliorer les défenses, réparer, lancer des sorts"><b>0</b></span><span id="stk"></span><span id="tm" title="Temps de jeu"></span></div>
<div class="btns"><button class="ib" id="bSnd" title="Son"></button><button class="ib" id="bPause" title="Pause (Échap)"></button><button class="ib" id="bFull" title="Plein écran"></button><button class="ib" id="bMenu" title="Pause"></button></div></header>
<div id="stage"><canvas id="cv"></canvas><div id="radial" hidden></div><div id="tip" hidden></div><div id="banner"></div></div>
<aside id="acts"></aside>
<section id="qpane"></section>
</div>
<div class="ov" id="ovStart" hidden></div><div class="ov" id="ovOver" hidden></div><div class="ov" id="ovPause" hidden></div><div class="ov" id="ovProf" hidden></div>
<div class="toast" id="toast"></div>
<script>
//@@ qpcfra.js
"use strict";
const I = v => ({k: 'i', v});
function D(v, s){ while (s > 0 && v % 10 === 0){ v /= 10; s--; } return s === 0 ? I(v) : {k: 'd', v, s}; }
const F = (n, d) => d < 0 ? {k: 'f', n: -n, d: -d} : {k: 'f', n, d};
const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b){ [a, b] = [b, a % b]; } return a; };
const lcm = (a, b) => a / gcd(a, b) * b;
const Fr = (n, d) => { if (d < 0){ n = -n; d = -d; } const g = gcd(n, d) || 1; return F(n / g, d / g); };
const ds = x => x.k === 'i' ? {v: x.v, s: 0} : {v: x.v, s: x.s};
const neg = x => ((x.k === 'i' || x.k === 'd') && x.v < 0) || (x.k === 'f' && x.n < 0) || (x.k === 'x' && !!x.ng);
function dig(x){ const {v, s} = ds(x), a = Math.abs(v), p = 10 ** s;
  return {neg: v < 0, int: String(Math.floor(a / p)), dec: s ? String(a % p).padStart(s, '0') : ''}; }
// valeur décimale exacte à partir d'un nombre JS (≤ 6 décimales)

SIM.UNAME = {mel: ['Guerrier à massue', 'Hoplite', 'Chevalier', 'Fantassin', 'Cyborg'], dis: ['Frondeur', 'Archer', 'Arbalétrier', 'Tireur', 'Soldat laser'],
  lou: ['Dinosaure', 'Éléphant', 'Cavalier', 'Tank', 'Robot géant']};
SIM.SPAWN = {1: [.72, .23, .05], 2: [.55, .32, .13], 3: [.4, .35, .25], 4: [.28, .34, .38]};   // tirage de l'unité selon la difficulté
SIM.EXTRA = {1: 0, 2: .12, 3: .25, 4: .4};                                                       // une 2e unité (au hasard aussi)
SIM.DEF = {
  tir: {cost: 70, dmg: 7, cd: .8, rng: 22, desc: 'Tire vite et loin, sur un ennemi à la fois.'},
  lan: {cost: 90, dmg: 13, cd: 2.2, rng: 26, aoe: 4, desc: 'Lent, mais touche tout un groupe.'},
  ral: {cost: 60, dmg: 2, cd: 1.6, rng: 18, aoe: 5, slowT: 2, desc: 'Ralentit les ennemis devant le mur.'},
  cha: {cost: 80, dmg: 22, cd: 2.8, rng: 7, desc: 'Gros dégâts, mais seulement tout près du mur.'}
};
SIM.DKINDS = ['tir', 'lan', 'ral', 'cha'];
SIM.DNAME = {tir: ['Lance-pierres', 'Arc', 'Arbalète', 'Mitrailleuse', 'Tourelle laser'], lan: ['Lanceur de rochers', 'Catapulte', 'Canon', 'Mortier', 'Lance-plasma'],
  ral: ['Lance-filets', 'Lance-filets', 'Lance-filets', 'Canon à colle', 'Canon à glace'], cha: ['Chaudron de braises', 'Chaudron d’huile', 'Chaudron d’huile', 'Lance-flammes', 'Lance-flammes à plasma']};
SIM.DTYPE = {tir: 'Tireur', lan: 'Lanceur', ral: 'Ralentisseur', cha: 'Chaudron'};
SIM.SLOTY = [3.2, 6.4, 9.6, 12.8]; SIM.SLOTX = 6.6;            // créneaux du mur (tous ouverts)
SIM.UPS = {tir: ['dmg', 'spd', 'rng'], lan: ['dmg', 'spd', 'rng'], ral: ['eff', 'spd', 'rng'], cha: ['dmg', 'spd', 'rng']};
SIM.UPNAME = {dmg: 'Dégâts', spd: 'Vitesse d’attaque', rng: 'Portée', eff: 'Effet'};
SIM.MULT = [1, 1.3, 1.6, 1.9]; SIM.SPD = [1, 1.2, 1.42, 1.68]; SIM.RUP = [0, 3, 6, 9]; SIM.SLOW = [.55, .47, .4, .34];
SIM.UPC = [.7, 1, 1.4]; SIM.UPMAX = 3; SIM.SELL = .6;
SIM.BHP = [900, 1300, 1900, 2700, 3800];                         // vie de notre base, selon notre ère
SIM.EHP = 11000;                                                // vie de la base ennemie (carte 1)
SIM.ETUR = {dmg: 9, cd: 1.5, rng: 22};                         // la tour de la base ennemie
SIM.MAPS = [{id: 'val', name: 'La vallée', tier: 1}, {id: 'des', name: 'Le désert', tier: 2}, {id: 'vol', name: 'Le volcan', tier: 3}];
SIM.TIER = {1: {rate: 1, era: 1, hp: 1}, 2: {rate: 1.1, era: 1.07, hp: 1.2}, 3: {rate: 1.2, era: 1.14, hp: 1.4}};
SIM.EI0 = 18; SIM.ERAT = 190; SIM.EGROW = 420; SIM.EGMAX = 2; // envois ennemis : intervalle de départ (s), durée d'une ère ennemie, accélération (au plus × 2)
SIM.VET = 120;                                                 // ennemi à la 5e ère : ses nouvelles unités gagnent 100 % de force en 2 min (pas de partie sans fin)
SIM.SPELL = {gel: {cost: 60, cd: 30, dur: 4}, rue: {cost: 60, cd: 30, dur: 8}, rep: {cost: 50, cd: 8, frac: .25}};
SIM.GOLD0 = 90;

/* ---------- hasard (graine dans la partie : une partie reprise continue pareil) ---------- */
SIM.rnd = G => { G.rs = (G.rs + 0x6D2B79F5) >>> 0; let t = G.rs; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
SIM.wpick = (G, w) => { let r = SIM.rnd(G) * w.reduce((a, b) => a + b, 0); for (let i = 0; i < w.length; i++){ r -= w[i]; if (r < 0) return i; } return w.length - 1; };

/* ---------- nouvelle partie ---------- */
SIM.newGame = (mapIdx, opts) => {
  opts = opts || {}; const m = SIM.MAPS[mapIdx], T = SIM.TIER[m.tier], eh = Math.round(SIM.EHP * T.hp);
  return {v: 1, map: mapIdx, tier: m.tier, t: 0, speed: opts.speed || 1, lvl: opts.lvl || 1, rs: opts.seed != null ? opts.seed >>> 0 : (Math.random() * 4294967296) >>> 0,
    era: 0, xp: 0, eEra: 0, eEraT: 0, eT: 5, gold: SIM.GOLD0, sp: 0, spT: 0, spE: 0, spX: [],
    base: {hp: SIM.BHP[0], max: SIM.BHP[0]}, ebase: {hp: eh, max: eh}, eturT: 1, etAim: null, etAtk: 0,
    units: [], nid: 1, q: [[], []], defs: [null, null, null, null], pend: [], cd: {gel: 0, rue: 0, rep: 0}, gelT: 0, rueT: 0,
    over: false, won: false, ev: [], fx: [], st: {kills: 0, lost: 0, spawned: 0, eSpawned: 0, ebaseDmg: 0}};
};
// l'ennemi s'adapte à la difficulté automatique de l'élève (de ★ à ★★★★)
SIM.adapt = G => .8 + .1 * (Math.max(1, Math.min(4.99, G.lvl || 1)) - 1);
SIM.eInterval = G => SIM.EI0 / (SIM.adapt(G) * SIM.TIER[G.tier].rate * Math.min(SIM.EGMAX, 1 + G.t / SIM.EGROW));
SIM.vet = G => G.e5t != null ? 1 + (G.t - G.e5t) / SIM.VET : 1;
SIM.eWeights = G => { const lou = Math.max(0, Math.min(.28, (G.t - 40) / 1000)), dis = .28; return [1 - dis - lou, dis, lou]; };
SIM.HPUP = 1.1;                                                // nos unités : 10 % de vie en plus (l'enseignant, 24.11.2026 : 5 % « pour rendre le jeu plus facile », puis « le jeu reste un peu dur, mets 10% ») ; dégâts inchangés
SIM.newUnit = (G, s, k, e) => { const U = SIM.UNIT[k], f = SIM.F[e] * (s ? SIM.vet(G) : 1), hp = U.hp * f * (s ? 1 : SIM.HPUP); return {id: G.nid++, s, k, e, f, x: s ? SIM.X1 : SIM.X0, w: U.w, hp, max: hp, cdT: .3, slowT: 0, slowF: 1, an: 0, atk: 0}; };

/* ---------- une bonne réponse ---------- */
SIM.correct = (G, lv, gold) => {
  G.gold += gold; G.xp += SIM.XPQ[lv]; G.sp = Math.min(SIM.SPMAX, G.sp + SIM.SPQ[lv]);
  const out = [SIM.KINDS[SIM.wpick(G, SIM.SPAWN[lv])]];
  if (SIM.rnd(G) < SIM.EXTRA[lv]) out.push(SIM.KINDS[SIM.wpick(G, SIM.SPAWN[lv])]);
  out.forEach(k => G.q[0].push({k, e: G.era})); G.st.spawned += out.length;
  while (G.era < 4 && G.xp >= SIM.XPN[G.era + 1]){ G.era++; const add = SIM.BHP[G.era] - SIM.BHP[G.era - 1]; G.base.max += add; G.base.hp += add; G.ev.push({e: 'era', n: G.era}); }
  return out;
};
SIM.xpFrac = G => G.era >= 4 ? 1 : (G.xp - SIM.XPN[G.era]) / (SIM.XPN[G.era + 1] - SIM.XPN[G.era]);

/* ---------- défenses ---------- */
SIM.defStats = (G, d) => {
  const D = SIM.DEF[d.k], f = SIM.F[G.era], up = d.up;
  return {dmg: D.dmg * f * (d.k === 'ral' ? 1 : SIM.MULT[up.dmg || 0]), cd: D.cd / SIM.SPD[up.spd], rng: D.rng + SIM.RUP[up.rng] * (d.k === 'cha' ? .3 : 1),
    aoe: D.aoe || 0, slow: d.k === 'ral' ? SIM.SLOW[up.eff || 0] : 1, slowT: d.k === 'ral' ? D.slowT + .4 * (up.eff || 0) : 0};
};
SIM.statsOf = (G, k, up) => SIM.defStats(G, {k, up: Object.assign({dmg: 0, eff: 0, spd: 0, rng: 0}, up || {})});
SIM.upCost = (k, lvl) => Math.round(SIM.DEF[k].cost * SIM.UPC[lvl]);
SIM.build = (G, i, k) => { const c = SIM.DEF[k].cost; if (G.defs[i] || G.gold < c || G.over) return false;
  G.gold -= c; G.defs[i] = {k, up: {dmg: 0, eff: 0, spd: 0, rng: 0}, inv: c, cdT: .4, atk: 0, aim: null}; G.ev.push({e: 'build'}); return true; };
SIM.upgrade = (G, i, u) => { const d = G.defs[i]; if (!d || G.over) return false; const l = d.up[u]; if (l >= SIM.UPMAX) return false; const c = SIM.upCost(d.k, l);
  if (G.gold < c) return false; G.gold -= c; d.inv += c; d.up[u]++; G.ev.push({e: 'build'}); return true; };
SIM.sell = (G, i) => { const d = G.defs[i]; if (!d || G.over) return false; G.gold += Math.round(d.inv * SIM.SELL); G.defs[i] = null; return true; };

/* ---------- sorts, réparation, attaque spéciale ---------- */
SIM.actions = G => {
  const S = SIM.SPELL, ok = k => !G.over && G.gold >= S[k].cost && G.cd[k] <= 0;
  return [{a: 'sp', ok: !G.over && G.sp >= SIM.SPMAX && G.spT <= 0, fill: G.sp / SIM.SPMAX},
    {a: 'gel', cost: S.gel.cost, cd: G.cd.gel, ok: ok('gel')}, {a: 'rue', cost: S.rue.cost, cd: G.cd.rue, ok: ok('rue')},
    {a: 'rep', cost: S.rep.cost, cd: G.cd.rep, ok: ok('rep') && G.base.hp < G.base.max}];
};
SIM.act = (G, a) => {
  const A = SIM.actions(G).find(x => x.a === a); if (!A || !A.ok) return false;
  if (a === 'sp'){ G.sp = 0; G.spT = SIM.SPDELAY; G.spE = G.era;
    const xs = G.units.filter(u => u.s && u.hp > 0).map(u => u.x); G.spX = [];
    for (let i = 0; i < 16; i++) G.spX.push(xs.length && i % 2 === 0 ? xs[i / 2 % xs.length] + (SIM.rnd(G) - .5) * 3 : 18 + SIM.rnd(G) * 70);
    G.fx.push({k: 'sp', t0: G.t, d: SIM.SPDELAY + .6, e: G.era, xs: G.spX.slice()}); G.ev.push({e: 'sp'}); return true; }
  const S = SIM.SPELL[a]; G.gold -= S.cost; G.cd[a] = S.cd;
  if (a === 'gel'){ G.gelT = S.dur; G.fx.push({k: 'gel', t0: G.t, d: S.dur}); }
  else if (a === 'rue'){ G.rueT = S.dur; }
  else if (a === 'rep'){ const h = Math.round(G.base.max * S.frac); G.base.hp = Math.min(G.base.max, G.base.hp + h); G.fx.push({k: 'heal', t0: G.t, d: 1.2, h}); }
  G.ev.push({e: a}); return true;
};

/* ---------- un pas de la simulation ---------- */
SIM.step = (G, dt0) => {
  if (G.over) return;
  const dt = dt0 * G.speed, T = SIM.TIER[G.tier], A = SIM.adapt(G); G.t += dt;
  for (const k in G.cd) G.cd[k] = Math.max(0, G.cd[k] - dt);
  G.gelT = Math.max(0, G.gelT - dt); G.rueT = Math.max(0, G.rueT - dt);
  // l'ère de l'ennemi avance à son rythme
  if (G.eEra < 4){ G.eEraT += dt * A * T.era; if (G.eEraT >= SIM.ERAT){ G.eEraT = 0; G.eEra++; if (G.eEra === 4) G.e5t = G.t; G.ev.push({e: 'eera', n: G.eEra}); } }
  // envois de l'ennemi
  G.eT -= dt;
  if (G.eT <= 0){ G.eT += SIM.eInterval(G); G.q[1].push({k: SIM.KINDS[SIM.wpick(G, SIM.eWeights(G))], e: G.eEra}); G.st.eSpawned++; }
  // les unités en attente sortent dès qu'il y a la place
  for (const s of [0, 1]){ const Q = G.q[s]; if (!Q.length) continue; const w = SIM.UNIT[Q[0].k].w, x0 = s ? SIM.X1 : SIM.X0;
    if (!G.units.some(u => u.s === s && u.hp > 0 && Math.abs(u.x - x0) < (u.w + w) / 2 + .3)){ const it = Q.shift(); G.units.push(SIM.newUnit(G, s, it.k, it.e)); } }
  SIM.fight(G, dt); SIM.defend(G, dt); SIM.turret(G, dt);
  if (G.spT > 0){ G.spT -= dt; if (G.spT <= 0){ G.spT = 0; const d = SIM.SPDMG * SIM.F[G.spE]; G.units.forEach(u => { if (u.s && u.hp > 0) u.hp -= d; });
    G.spX.forEach(x => G.fx.push({k: 'boom', t0: G.t, d: .5, x, y: .6, r: 2.2, e: G.spE})); } }
  // coups en route (projectiles)
  for (let i = G.pend.length - 1; i >= 0; i--){ const p = G.pend[i]; if (G.t < p.at) continue; G.pend.splice(i, 1);
    if (p.base != null){ const B = p.base ? G.ebase : G.base; B.hp -= p.dmg; if (p.base) G.st.ebaseDmg += p.dmg; continue; }
    if (p.aoe){ G.units.forEach(u => { if (u.s === p.side && u.hp > 0 && Math.abs(u.x - p.x) <= p.aoe + u.w / 2){ u.hp -= p.dmg; if (p.slow){ u.slowT = Math.max(u.slowT, p.slowT); u.slowF = Math.min(u.slowT > 0 ? u.slowF : 1, p.slow); } } });
      G.fx.push({k: p.slow ? 'net' : 'boom', t0: G.t, d: p.slow ? .6 : .45, x: p.x, y: .5, r: p.aoe, e: p.e}); continue; }
    const u = G.units.find(z => z.id === p.tid); if (u && u.hp > 0) u.hp -= p.dmg; }
  // morts
  for (let i = G.units.length - 1; i >= 0; i--){ const u = G.units[i]; if (u.hp > 0) continue;
    G.units.splice(i, 1); G.fx.push({k: 'die', t0: G.t, d: .7, x: u.x, s: u.s, w: u.w}); if (u.s) G.st.kills++; else G.st.lost++; }
  G.fx = G.fx.filter(f => G.t - f.t0 < f.d);
  if (G.ebase.hp <= 0){ G.ebase.hp = 0; G.over = true; G.won = true; G.ev.push({e: 'over'}); }
  else if (G.base.hp <= 0){ G.base.hp = 0; G.over = true; G.won = false; G.ev.push({e: 'over'}); }
};
// combat : chaque unité vise l'ennemi le plus proche (ou la base) ; sinon elle avance, sans passer l'unité alliée devant elle
SIM.fight = (G, dt) => {
  const L = G.units.filter(u => u.hp > 0), A = L.filter(u => !u.s).sort((a, b) => b.x - a.x), B = L.filter(u => u.s).sort((a, b) => a.x - b.x);
  for (const [mine, foe, dir] of [[A, B, 1], [B, A, -1]]){
    const frozen = dir < 0 && G.gelT > 0, rue = dir > 0 && G.rueT > 0;
    for (let i = 0; i < mine.length; i++){
      const u = mine[i], U = SIM.UNIT[u.k]; u.atk = Math.max(0, u.atk - dt); u.slowT = Math.max(0, u.slowT - dt); if (u.slowT <= 0) u.slowF = 1;
      if (frozen || u.hp <= 0) continue;
      u.cdT -= dt;
      const e = foe.find(z => z.hp > 0);
      const gap = e ? (dir > 0 ? (e.x - e.w / 2) - (u.x + u.w / 2) : (u.x - u.w / 2) - (e.x + e.w / 2)) : 1e9;
      const bgap = dir > 0 ? SIM.WR - (u.x + u.w / 2) : (u.x - u.w / 2) - SIM.WL;
      const tgt = gap <= U.rng ? e : null, atBase = !tgt && bgap <= U.rng;
      if (tgt || atBase){
        if (u.cdT <= 0){
          u.cdT = U.cd; u.atk = .35; const dmg = U.dmg * u.f * (rue ? 1.5 : 1);
          if (u.k === 'dis' || (u.k === 'lou' && u.e === 3)){             // à distance (et l'obus du tank) : un projectile
            const tx = tgt ? tgt.x : (dir > 0 ? SIM.WR + 1.2 : SIM.WL - 1.2), dist = Math.abs(tx - u.x), d = Math.min(.45, .12 + dist / 45);
            G.pend.push(tgt ? {at: G.t + d, tid: tgt.id, dmg} : {at: G.t + d, base: dir > 0 ? 1 : 0, dmg});
            G.fx.push({k: 'shot', t0: G.t, d, s: u.s, e: u.e, src: u.k, x0: u.x + dir * u.w * .35, y0: u.k === 'lou' ? 2 : 2.2, x1: tx, y1: tgt ? 1.6 : 4});
          } else if (tgt){ tgt.hp -= dmg; G.fx.push({k: 'hit', t0: G.t, d: .25, x: tgt.x - dir * tgt.w * .3, y: 1.8}); }
          else { const B = dir > 0 ? G.ebase : G.base; B.hp -= dmg; if (dir > 0) G.st.ebaseDmg += dmg; G.fx.push({k: 'hit', t0: G.t, d: .25, x: dir > 0 ? SIM.WR + .3 : SIM.WL - .3, y: 2}); }
        }
      } else {
        u.cdT = Math.max(u.cdT, 0);
        let nx = u.x + dir * U.spd * (u.slowT > 0 ? u.slowF : 1) * (rue ? 1.5 : 1) * dt;
        let ah = null; for (let j = i - 1; j >= 0; j--) if (mine[j].hp > 0 && (u.k === 'dis' || mine[j].k !== 'dis')){ ah = mine[j]; break; }   // on passe devant une unité à distance
        if (ah) nx = dir > 0 ? Math.min(nx, ah.x - (ah.w + u.w) / 2 - .35) : Math.max(nx, ah.x + (ah.w + u.w) / 2 + .35);
        if (e) nx = dir > 0 ? Math.min(nx, e.x - (e.w + u.w) / 2) : Math.max(nx, e.x + (e.w + u.w) / 2);
        nx = dir > 0 ? Math.min(nx, SIM.WR - u.w / 2) : Math.max(nx, SIM.WL + u.w / 2);
        if (dir > 0 ? nx > u.x : nx < u.x){ u.an += Math.abs(nx - u.x); u.x = nx; }
      }
    }
  }
};
// nos défenses : elles visent l'ennemi le plus proche du mur
SIM.defend = (G, dt) => {
  const foes = G.units.filter(u => u.s && u.hp > 0).sort((a, b) => a.x - b.x);
  G.defs.forEach((d, i) => {
    if (!d) return; d.cdT -= dt; d.atk = Math.max(0, d.atk - dt); if (d.cdT > 0) return;
    const S = SIM.defStats(G, d), inR = foes.filter(u => u.hp > 0 && (u.x - u.w / 2) - SIM.WL <= S.rng);
    if (!inR.length){ d.cdT = 0; return; }
    const t = inR[0], y0 = SIM.SLOTY[i] + .5, x0 = SIM.SLOTX + 1; d.cdT = S.cd; d.atk = .3; d.aim = t.x;
    if (d.k === 'tir'){ const fl = Math.min(.3, .08 + (t.x - x0) / 90); G.pend.push({at: G.t + fl, tid: t.id, dmg: S.dmg}); G.fx.push({k: 'shot', t0: G.t, d: fl, s: 0, e: G.era, src: 'tir', x0, y0, x1: t.x, y1: 1.6}); }
    else if (d.k === 'lan' || d.k === 'ral'){ const fl = .45 + (t.x - x0) / 120; G.pend.push({at: G.t + fl, x: t.x, aoe: S.aoe, dmg: S.dmg, side: 1, e: G.era, slow: d.k === 'ral' ? S.slow : 0, slowT: S.slowT});
      G.fx.push({k: 'lob', t0: G.t, d: fl, e: G.era, src: d.k, x0, y0, x1: t.x, y1: .6}); }
    else { inR.forEach(u => { u.hp -= S.dmg; }); G.fx.push({k: 'fire', t0: G.t, d: .55, e: G.era, x0: SIM.WL, x1: SIM.WL + S.rng, y0}); }
  });
};
// la tour de la base ennemie
SIM.turret = (G, dt) => {
  G.etAtk = Math.max(0, G.etAtk - dt); if (G.gelT > 0) return; G.eturT -= dt; if (G.eturT > 0) return;
  const P = G.units.filter(u => !u.s && u.hp > 0).sort((a, b) => b.x - a.x), t = P[0];
  if (!t || SIM.WR - (t.x + t.w / 2) > SIM.ETUR.rng){ G.eturT = 0; return; }
  G.eturT = SIM.ETUR.cd; G.etAtk = .3; G.etAim = t.x; const x0 = 100 - SIM.SLOTX - 1, y0 = SIM.SLOTY[3] + .5, fl = Math.min(.3, .08 + (x0 - t.x) / 90);
  G.pend.push({at: G.t + fl, tid: t.id, dmg: SIM.ETUR.dmg * SIM.F[G.eEra]}); G.fx.push({k: 'shot', t0: G.t, d: fl, s: 1, e: G.eEra, src: 'tir', x0, y0, x1: t.x, y1: 1.6});
};
// pour l'enregistrement : tout sauf les effets et les événements
SIM.snap = G => { const o = Object.assign({}, G); o.fx = []; o.ev = []; return JSON.parse(JSON.stringify(o)); };
//@@ render.js
/* =====================================================================
   Dessin (canvas, vue de côté) : décor de la carte, les deux bases (une allure par ère), les défenses du mur, les unités (trois
   par ère : corps à corps, à distance, lourde), les projectiles et les effets. Unité de dessin = une unité du champ de bataille.
   ===================================================================== */
const RD = {cv: null, cx: null, W: 0, H: 0, dpr: 1, u: 10, ox: 0, gy: 0, bg: null, bgKey: '', img: {}};
const TAU = Math.PI * 2;
const TEAM = [{c: '#2f6fc0', d: '#1b4a85', l: '#9cc2f0'}, {c: '#c8402f', d: '#8e2a1f', l: '#f2a596'}];
const MAT = [{m: '#9a6a38', d: '#5e3d1d', l: '#c08c55'}, {m: '#dccfae', d: '#9c8a64', l: '#f1e9d6'}, {m: '#8f9196', d: '#55585e', l: '#bcbec2'},
  {m: '#868d79', d: '#4f5547', l: '#aeb4a0'}, {m: '#c3cfdb', d: '#61768a', l: '#edf3f8'}];
const GLOW = '#38e1ff', SKIN = '#f0c49c';
const SKYC = {val: {s0: '#78b9e6', s1: '#dcf0fb', m: '#9db7c8', h: '#79a863', g: '#6b9a4c', g2: '#557d3a', d: '#86663f'},
  des: {s0: '#e7a456', s1: '#fbe4bf', m: '#d6ad86', h: '#e3c182', g: '#d8b272', g2: '#bf9657', d: '#a17541'},

function fitQ(){

    let f = fs * (lines ? 1.9 : 2.5); x.style.fontSize = f + 'px';
    for (let k = 0; k < 40 && (x.scrollWidth > box.clientWidth + 1 || box.scrollHeight > box.clientHeight + 1) && f > 15; k++){ f *= .93; x.style.fontSize = f + 'px'; } }
  const R = $('#qpane .qR'), za = $('#qpane .za'); if (R && za){ let g = 1.5; const set = () => za.querySelectorAll('.ch').forEach(c => c.style.fontSize = (c.classList.contains('tx') ? g / 1.5 : g) + 'em'); set();
    for (let k = 0; k < 12 && R.scrollHeight > R.clientHeight + 1 && g > 1; k++){ g *= .92; set(); } }

}

  const it = SIM.UPS[d.k].map(up => { const l = d.up[up], max = l >= SIM.UPMAX, c = max ? 0 : SIM.upCost(d.k, l); return {a: 'upg', u: up, lvl: l, max, cost: c, ok: !max && G.gold >= c, icon: ICON[up]}; });
  it.push({a: 'sell', cost: Math.round(d.inv * SIM.SELL), ok: true, icon: ICON.sell});

function radialPos(n){                               // en éventail à droite du créneau, sans sortir du champ de bataille
  const i = APP.sel, cx = WX(SIM.SLOTX), cy = WY(SIM.SLOTY[i] + .6), rs = Math.max(48, Math.min(112, 4.4 * RD.u)), R = rs * 1.25;
  const angs = n === 4 ? [-63, -21, 21, 63] : [-45, 0, 45];
  const P = angs.map(a => ({x: cx + rs * .45 + R * Math.cos(a * Math.PI / 180), y: cy + R * Math.sin(a * Math.PI / 180)}));
  const top = Math.min(...P.map(p => p.y)) - rs / 2 - 4, bot = Math.max(...P.map(p => p.y)) + rs / 2 + rs * .25;
  let dy = 0; if (top < 0) dy = -top; if (bot + dy > RD.H) dy = RD.H - bot; P.forEach(p => p.y += dy);

}

const radialName = a => a.a === 'build' ? SIM.DNAME[a.k][APP.G.era] : a.a === 'upg' ? SIM.UPNAME[a.u] : 'Vendre';

function slotAt(e){
  const r = RD.cv.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top, u = RD.u;
  for (let i = 0; i < 4; i++){ const cx = WX(SIM.SLOTX), cy = WY(SIM.SLOTY[i] + .7); if (Math.hypot(mx - cx, my - cy) < 1.5 * u) return i;
    if (APP.G.defs[i] && mx > WX(5) && mx < WX(9.2) && my > WY(SIM.SLOTY[i] + 2) && my < WY(SIM.SLOTY[i] - .3)) return i; }
  return null;
}

/* ---------- boucle ---------- */
function onEv(ev){
  const G = APP.G;
  if (ev.e === 'era'){ banner('Nouvelle ère : ' + SIM.ERA[ev.n] + '&nbsp;!', ev.n === 4 ? 'La dernière ère : à l’attaque de la base ennemie&nbsp;!' : 'Tes soldats et tes défenses sont plus forts'); SND.era(); actsRender(); RADSIG = ''; }
  else if (ev.e === 'eera'){ banner('L’ennemi passe à l’ère : ' + SIM.ERA[ev.n], ev.n === 4 ? 'Il devient de plus en plus fort : dépêche-toi&nbsp;!' : ev.n > G.era ? 'Il est en avance sur toi : réponds juste pour le rattraper' : ''); SND.eera(); }
}
let LAST = 0, TOPT = 0, SAVET = 0;
function loop(ts){
  requestAnimationFrame(loop);
  const dt = Math.min(.1, (ts - LAST) / 1000 || 0); LAST = ts;
  const G = APP.G; if (!G || APP.state === 'start') return;
  if (APP.state === 'play' && !APP.paused){
    for (let s = dt; s > 1e-6; s -= 1 / 30) SIM.step(G, Math.min(1 / 30, s));
    G.ev.forEach(onEv); G.ev.length = 0;
    const u = APP.u;
    if (u.st === 'ok'){ u.okT -= dt; if (u.okT <= 0) nextQ(); }
    if (u.waitT > 0){ u.waitT -= dt; if (u.waitT <= 0){ u.waitT = 0; qRender(); } }
    if (G.over) return gameOver(G.won);
  }
  let range = 0, next = 0;
  if (APP.sel != null){ const d = G.defs[APP.sel], it = APP.rhover != null ? radialItems()[APP.rhover] : null;
    if (d){ range = SIM.defStats(G, d).rng; if (it && it.a === 'upg' && it.u === 'rng' && !it.max){ const up = Object.assign({}, d.up); up.rng++; next = SIM.defStats(G, {k: d.k, up}).rng; } }
    else if (it && it.a === 'build') range = SIM.statsOf(G, it.k).rng; }
  try { rdFrame(G, {sel: APP.sel, hover: APP.hover, range, next}); } catch (e) { console.error(e); }
  if (ts - TOPT > 250){ TOPT = ts; topBar(); const u = APP.u, c = $('#qpane .cnt'), w = $('#qpane .wbar i'); if (c) c.textContent = Math.max(1, Math.ceil(u.waitT)); if (w) w.style.width = (100 * (1 - u.waitT / u.wait0)).toFixed(1) + '%';
    actsTick(); if (APP.sel != null && radialSig() !== RADSIG) radialRender(); }
  if (ts - SAVET > 3000){ SAVET = ts; if (APP.state === 'play') save(); }
}
function topBar(){
  const G = APP.G; if (!G) return;
  const f = Math.max(0, G.base.hp / G.base.max), ef = Math.max(0, G.ebase.hp / G.ebase.max);
  $('#hpb i').style.width = (100 * f).toFixed(1) + '%'; $('#hpb').classList.toggle('low', f < .35); $('#hpt').textContent = Math.ceil(G.base.hp);
  $('#ehpb i').style.width = (100 * ef).toFixed(1) + '%'; $('#ehpt').textContent = Math.ceil(100 * ef) + ' %';
  $('#eraN').textContent = 'Ère ' + (G.era + 1) + '/5 : ' + SIM.ERA[G.era]; $('#xpb i').style.width = (100 * SIM.xpFrac(G)).toFixed(1) + '%';
  $('#eraG').title = G.era < 4 ? 'Tes bonnes réponses remplissent la barre ; pleine, tu passes à l’ère suivante (' + SIM.ERA[G.era + 1] + ')' : 'Tu es à la dernière ère';
  $('#eEraN').textContent = SIM.ERA[G.eEra]; $('#eEraN').title = 'Ère de l’ennemi';
  $('#gold b').textContent = G.gold; $('#stk').textContent = APP.u && APP.u.streak >= 3 ? 'série ×' + APP.u.streak : ''; $('#tm').textContent = clock(G.t);
}
let BT = 0;

/* ---------- pause, fin de partie ---------- */

}
function gameOver(won){
  if (APP.state !== 'play') return;
  APP.state = 'over'; APP.sel = null; APP.rhover = null; radialRender(); topBar(); actsRender();
  const p = APP.pl, G = APP.G, m = SIM.MAPS[APP.mapIdx]; p.games = (p.games || 0) + 1; p.lvlD = p.lvl;
  let unl = '', nextBtn = '';
  if (won){ p.wins = (p.wins || 0) + 1; const first = !p.won[m.id]; p.won[m.id] = true; if (!p.best[m.id] || G.t < p.best[m.id]) p.best[m.id] = G.t;
    const nx = SIM.MAPS[APP.mapIdx + 1]; if (nx){ if (first) unl = '<div class="unl">Nouvelle carte débloquée : <b>' + nx.name + '</b> (questions plus difficiles, plus d’or, plus d’ennemis)</div>'; nextBtn = '<button class="btn pri" data-next="1">Carte suivante : ' + nx.name + '</button>'; } }
  ls.del(KEY_GAME); saveProg(); (won ? SND.win : SND.lose)();
  const ov = $('#ovOver');
  ov.innerHTML = '<div class="card" style="text-align:center;min-width:min(560px,92vw)">' + (won ? '<h1 class="win">' + CROWN + 'Victoire&nbsp;!</h1>' : '<h1>Ta base est tombée&nbsp;!</h1>') + '<div class="res">' +
    '<div>' + (won ? 'Base ennemie détruite en ' : 'Tu as tenu ') + fmtT(G.t) + '</div><div>Ère atteinte : <b>' + SIM.ERA[G.era] + '</b> <span class="note">(ennemi : ' + SIM.ERA[G.eEra] + ')</span></div>' +
    (won ? '' : '<div>Base ennemie détruite à ' + Math.round(100 * (1 - G.ebase.hp / G.ebase.max)) + ' %</div>') + '<div>Bonnes réponses : ' + p.nOkG + ' sur ' + p.nAnsG + '</div></div>' + unl +
    (won ? '' : '<p class="note" style="max-width:34em;margin:.6em auto 0">Pour gagner, il faut presque toujours arriver à la dernière ère (Futur) avant l’ennemi : plus tu réponds juste, plus vite tu y arrives.</p>') +
    '<div class="go">' + nextBtn + '<button class="btn' + (nextBtn ? '' : ' pri') + '" data-replay="1">Rejouer</button><button class="btn" data-maps="1">Cartes</button></div></div>';
  setTimeout(() => { if (APP.state === 'over') ov.hidden = false; }, 900);
}

  $('#ovProf').hidden = false; renderProf();
}
function closeProf(){ $('#ovProf').hidden = true; if (APP.profPaused && APP.state === 'play') pauseGame(false); APP.profPaused = false; if (APP.state === 'start') startScreen(); }
function renderProf(){
  const C = APP.cfg, url = linkFor(C), p = APP.pl;
  let qr = ''; try { qr = qrSVG(QR.make(url, 'M')); } catch (e) { qr = ''; }
  const st = '<tr>' + ALLK.map(k => { const s = p.stats[k]; return '<td>' + (s ? s.ok + '/' + s.n + (s.vu ? ' <span class="note">(' + s.vu + ' vues)</span>' : '') : '–') + '</td>'; }).join('') + '<td><b>' + p.nOk + '/' + p.nAns + '</b></td></tr>';
  const won = SIM.MAPS.filter(m => p.won[m.id]).map(m => m.name + ' (record ' + fmtT(p.best[m.id]) + ')');
  $('#ovProf').innerHTML = '<div class="card prof" style="width:min(900px,96vw)"><h2>Espace enseignant<button class="ib" data-close="1" style="margin-left:auto;background:#3b4654">✕</button></h2>' +
    '<section><b>Thèmes</b> (les élèves ne peuvent pas les changer)<br>' + ALLK.map(k => '<label><input type="checkbox" data-kind="' + k + '"' + (C.kinds.includes(k) ? ' checked' : '') + '>' + CD_KINDS[k].lab + '</label>').join('') +
    '<br><label><input type="checkbox" data-opt="rel"' + (C.rel ? ' checked' : '') + '>nombres relatifs</label><label><input type="checkbox" data-opt="dec"' + (C.dec ? ' checked' : '') + '>nombres à virgule</label>' +
    '<div class="note">Les changements valent pour les questions suivantes.</div></section>' +
    '<section><b>Lien pour les élèves</b> (Google Classroom)<div class="lk"><div class="qr">' + qr + '</div><div><div class="url">' + url + '</div><p><button class="btn" data-copy="1">Copier le lien</button></p>' +
    '<div class="note">Le lien ouvre le jeu en ligne avec ces thèmes.Sur la clé USB, les thèmes cochés ici valent pour cet ordinateur.</div></div></div></section>' +
    '<section><b>Jeu</b><br>Vitesse : <span class="seg">' + [[.75, 'lente'], [1, 'normale'], [1.25, 'rapide']].map(([v, l]) => '<button data-speed="' + v + '" class="' + (APP.speed === v ? 'on' : '') + '">' + l + '</button>').join('') + '</span>' +
    '<label style="margin-left:1em"><input type="checkbox" data-snd="1"' + (APP.sound ? ' checked' : '') + '>son</label>' +
    '<label style="margin-left:1em"><input type="checkbox" data-unl="1"' + (p.unlockAll ? ' checked' : '') + '>toutes les cartes ouvertes (cet ordinateur)</label></section>' +
    '<section><b>Progrès sur cet ordinateur</b> · ' + (p.games || 0) + ' partie' + ((p.games || 0) > 1 ? 's' : '') + ' · ' + (p.wins || 0) + ' victoire' + ((p.wins || 0) > 1 ? 's' : '') + (won.length ? ' : ' + won.join(', ') : '') + '<br>' +
    '<table><tr>' + ALLK.map(k => '<th>' + CD_KINDS[k].lab + '</th>').join('') + '<th>Total</th></tr>' + st + '</table>' +
    '<p><button class="btn" data-reset="1">Tout remettre à zéro (cartes, records, statistiques)</button></p></section></div>';
}
function onProf(t){
  if (t.dataset.close){ closeProf(); return; }
  if (t.dataset.kind){ const k = t.dataset.kind; let ks = APP.cfg.kinds.filter(x => x !== k); if (t.checked) ks.push(k); ks = ALLK.filter(x => ks.includes(x)); if (!ks.length) ks = ['Mfra+']; APP.cfg.kinds = ks; renderProf(); saveCfg(); return; }
  if (t.dataset.opt){ APP.cfg[t.dataset.opt] = t.checked; renderProf(); saveCfg(); return; }
  if (t.dataset.speed){ APP.speed = +t.dataset.speed; if (APP.G) APP.G.speed = APP.speed; renderProf(); saveCfg(); return; }
  if (t.dataset.snd){ APP.sound = t.checked; $('#bSnd').innerHTML = APP.sound ? SVGI.snd : SVGI.mute; $('#bSnd').classList.toggle('on', APP.sound); return; }
  if (t.dataset.unl){ APP.pl.unlockAll = t.checked; saveProg(); return; }
  if (t.dataset.copy){ const url = linkFor(APP.cfg); try { navigator.clipboard.writeText(url).then(() => toast('Lien copié')); } catch (e) { toast(url); } return; }
  if (t.dataset.reset){ if (Date.now() - (APP.resetArm || 0) > 4000){ APP.resetArm = Date.now(); toast('Clique encore une fois pour tout remettre à zéro'); return; } ls.del(KEY_PROG); ls.del(KEY_GAME); location.reload(); }
}
function onKey(e){
  if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (/^[a-z]$/i.test(e.key)){ APP.profBuf = (APP.profBuf + e.key.toLowerCase()).slice(-4); if (APP.profBuf === 'prof'){ APP.profBuf = ''; openProf(); return; } }
  if (e.key === 'Escape'){ if (!$('#ovProf').hidden){ closeProf(); return; } if (APP.state === 'play'){ if (APP.sel != null){ APP.sel = null; APP.rhover = null; radialRender(); return; } pauseGame(!APP.paused); } }
}

/* ---------- démarrage ---------- */
function fullscreen(){ const d = document, el = d.documentElement; if (!d.fullscreenElement && !d.webkitFullscreenElement){ const rq = el.requestFullscreen || el.webkitRequestFullscreen; if (rq){ const p = rq.call(el); if (p && p.catch) p.catch(() => {}); } } else { const ex = d.exitFullscreen || d.webkitExitFullscreen; if (ex) ex.call(d); } }
function init(){
  if (!CanvasRenderingContext2D.prototype.roundRect) CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r){ r = Math.min(r, w / 2, h / 2); this.moveTo(x + r, y); this.arcTo(x + w, y, x + w, y + h, r); this.arcTo(x + w, y + h, x, y + h, r); this.arcTo(x, y + h, x, y, r); this.arcTo(x, y, x + w, y, r); this.closePath(); return this; };
  RD.cv = $('#cv'); RD.cx = RD.cv.getContext('2d');
  $('#bPause').innerHTML = SVGI.pause; $('#bSnd').innerHTML = SVGI.mute; $('#bFull').innerHTML = SVGI.full; $('#bMenu').innerHTML = SVGI.menu; $('#hpi').innerHTML = SVGI.heart;
  $('#gold').insertAdjacentHTML('afterbegin', COIN);
  const C = ls.get(KEY_CFG); if (C){ APP.cfg = C.cfg; APP.speed = C.speed || 1; }
  readLink(); if (APP.link) saveCfg();
  const P = ls.get(KEY_PROG); APP.pl = newPlayer();
  if (P && P.v === 1){ PROG_FIELDS.forEach(f => { if (P[f] != null) APP.pl[f] = P[f]; }); (P.used || []).forEach(k => CDS.used.add(k)); TALLY = P.tally || {}; if (P.est && !Array.isArray(P.est)) EST_N = P.est; }
  const S = ls.get(KEY_GAME);
  if (S && S.v === 1 && S.G && Date.now() - S.ts < RESUME_MIN * 60000 && mapOpen(S.mapIdx)){ APP.mapIdx = S.mapIdx; startGame(S); } else { ls.del(KEY_GAME); startScreen(); }
  addEventListener('resize', layout); addEventListener('keydown', onKey);
  $('#qpane').addEventListener('click', onQClick); $('#acts').addEventListener('click', onActs);
  RD.cv.addEventListener('pointerdown', onCanvas); RD.cv.addEventListener('pointermove', onCanvasMove); RD.cv.addEventListener('pointerleave', () => { APP.hover = null; });
  $('#radial').addEventListener('click', onRadial); $('#radial').addEventListener('pointermove', onRadialMove); $('#radial').addEventListener('pointerleave', () => { if (APP.rhover != null){ APP.rhover = null; radialRender(); } });
  $('#ovStart').addEventListener('click', e => { const m = e.target.closest('[data-map]');
    if (m){ const i = +m.dataset.map; if (!mapOpen(i)){ toast('Gagne la carte d’avant pour ouvrir celle-ci'); return; }
      APP.mapIdx = i; document.querySelectorAll('.mapc').forEach(c => c.classList.toggle('sel', +c.dataset.map === APP.mapIdx)); }
    if (e.target.closest('[data-go]')) startGame(null); });
  $('#ovOver').addEventListener('click', e => { if (e.target.closest('[data-replay]')) startGame(null); else if (e.target.closest('[data-next]')){ APP.mapIdx++; startGame(null); } else if (e.target.closest('[data-maps]')) startScreen(); });
  $('#ovPause').addEventListener('click', e => { if (e.target.closest('[data-resume]')) pauseGame(false); else if (e.target.closest('[data-quit]')){ if (Date.now() - (APP.quitArm || 0) > 4000){ APP.quitArm = Date.now(); toast('Clique encore une fois pour abandonner la partie'); return; }
    APP.paused = false; APP.G.over = true; APP.G.won = false; $('#ovPause').hidden = true; gameOver(false); } });
  $('#ovProf').addEventListener('click', e => { if (e.target.id === 'ovProf') closeProf(); else { const b = e.target.closest('button'); if (b) onProf(b); } });
  $('#ovProf').addEventListener('change', e => onProf(e.target));
  $('#bPause').onclick = () => pauseGame(!APP.paused);
  $('#bSnd').onclick = () => { APP.sound = !APP.sound; $('#bSnd').innerHTML = APP.sound ? SVGI.snd : SVGI.mute; $('#bSnd').classList.toggle('on', APP.sound); };
  $('#bFull').onclick = fullscreen;
  let lp = 0; const bm = $('#bMenu');
  bm.addEventListener('pointerdown', () => { lp = setTimeout(() => { lp = -1; openProf(); }, 1200); });
  bm.addEventListener('pointerup', () => { if (lp > 0){ clearTimeout(lp); pauseGame(!APP.paused); } lp = 0; });
  bm.addEventListener('pointerleave', () => { if (lp > 0) clearTimeout(lp); lp = 0; });
  document.addEventListener('visibilitychange', () => { if (document.hidden){ save(); if (APP.state === 'play' && !APP.paused) pauseGame(true); } });
  addEventListener('beforeunload', () => { if (APP.G) save(); });
  layout(); requestAnimationFrame(loop);
}

init();
</script>
</body>
</html>
